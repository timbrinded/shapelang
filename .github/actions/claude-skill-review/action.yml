name: Claude skill review
description: >-
  Install the Bun toolchain and a pinned Claude Code CLI, then run one of the
  Shape skill reviews (review, guard, index) through
  .github/scripts/run-claude-skill.mjs, which validates the structured result
  against the skill's JSON schema and gates the job on its policy. The calling
  step provides Anthropic credentials and git context via env.

inputs:
  skill:
    description: Skill name understood by run-claude-skill.mjs (review, guard, or index).
    required: true
  prepare-command:
    description: Optional shell command run after changed-files, before the review (e.g. capturing shp context output).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Cache Bun downloads
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install
      shell: bash
      run: bun install --frozen-lockfile

    - name: Changed files
      shell: bash
      run: bun run changed-files

    - name: Prepare review context
      if: ${{ inputs.prepare-command != '' }}
      shell: bash
      run: ${{ inputs.prepare-command }}

    - name: Install Claude Code
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash -s 2.1.173
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/claude" --version

    - name: Run skill review
      shell: bash
      run: node .github/scripts/run-claude-skill.mjs ${{ inputs.skill }}
