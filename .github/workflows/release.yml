name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - &install
        name: Install
        run: bun install --frozen-lockfile

      - name: Check release tag matches CLI package version
        run: |
          set -euo pipefail
          cli_version="$(bun -e 'console.log((await import("./packages/shp-cli/package.json")).default.version)')"
          expected_tag="v${cli_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match packages/shp-cli/package.json version $cli_version."
            echo "Expected tag: $expected_tag"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Langium artifacts
        run: bun run langium:generate

      - name: Check generated artifacts
        run: git diff --exit-code -- packages/shp-checker/src/language/generated

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Shape conformance
        run: |
          bun run format:shape:check
          bun shp check
          bun shp obligations
          bun shp memory

      - name: Docs check
        run: bun run docs:check

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Build release assets
        run: bun run build:release

      - name: Smoke test release binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/shp-smoke
          tar -xzf dist/release/shp-linux-x64.tar.gz -C /tmp/shp-smoke
          /tmp/shp-smoke/shp --help >/dev/null
          /tmp/shp-smoke/shp check
          /tmp/shp-smoke/shp memory >/dev/null
          /tmp/shp-smoke/shp obligations >/tmp/shp-smoke/obligations.txt
          grep -q "No open shape obligations." /tmp/shp-smoke/obligations.txt

          set +e
          /tmp/shp-smoke/shp analyze \
            --shape-files fixtures/pass/append_only_append/audit.shape \
            fixtures/source/audit_purge.ts \
            >/tmp/shp-smoke/analyze.out \
            2>/tmp/shp-smoke/analyze.err
          analyze_status=$?
          set -e
          if [ "$analyze_status" -ne 1 ]; then
            echo "Expected analyzer smoke test to report a mismatch, got exit $analyze_status."
            cat /tmp/shp-smoke/analyze.out
            cat /tmp/shp-smoke/analyze.err >&2
            exit 1
          fi
          grep -q "HardDelete" /tmp/shp-smoke/analyze.err

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag
