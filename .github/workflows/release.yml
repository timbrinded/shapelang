name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

jobs:
  approval:
    name: Verify skill release approval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Require approved release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/check-release-approval.ts --require-exact

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: approval

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - &bun-cache
        name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - &install
        name: Install
        run: bun install --frozen-lockfile

      - name: Check release tag matches CLI and plugin versions
        run: bun scripts/check-release-metadata.ts --tag "$GITHUB_REF_NAME"

      - name: Validate shipped skills
        run: bun run skills:check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Langium artifacts
        run: bun run langium:generate

      - name: Check generated artifacts
        run: git diff --exit-code -- packages/shp-checker/src/language/generated

      - name: Check generated AST context
        run: bun run ast:check

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Shape conformance
        run: |
          bun run format:shape:check
          bun shp check
          bun shp obligations
          bun shp memory

      - name: Docs check
        run: bun run docs:check

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - *checkout
      - *setup-bun
      - *bun-cache
      - *install

      - name: Build release assets
        run: bun run build:release

      - name: Smoke test release binary
        run: |
          scripts/smoke-release-binary.sh \
            --expected-version "${GITHUB_REF_NAME#v}" \
            dist/release/shp-linux-x64.tar.gz
          bun scripts/run-release-canaries.ts --archive dist/release/shp-linux-x64.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun scripts/check-release-approval.ts --require-exact
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag

  verify:
    name: Verify published release (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install published shp through the setup action
        uses: ./
        with:
          version: ${{ github.ref_name }}

      - name: Verify installed version
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual="$(shp --version)"
          if [[ "$actual" != *"$expected"* ]]; then
            echo "Expected shp version $expected, got $actual." >&2
            exit 1
          fi
          shp check

      - name: Download release-hosted installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-installer"
          gh release download "$GITHUB_REF_NAME" \
            --dir "$RUNNER_TEMP/release-installer" \
            --pattern install.sh \
            --pattern install.ps1

      - name: Verify release-hosted installer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          SHAPE_INSTALL_DIR="$RUNNER_TEMP/shp-installer" \
            sh "$RUNNER_TEMP/release-installer/install.sh"
          test "$("$RUNNER_TEMP/shp-installer/shp" --version)" = "${GITHUB_REF_NAME#v}"

      - name: Verify release-hosted installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $InstallDir = Join-Path $env:RUNNER_TEMP "shp-installer"
          & (Join-Path $env:RUNNER_TEMP "release-installer/install.ps1") -InstallDir $InstallDir
          $Expected = $env:GITHUB_REF_NAME.TrimStart("v")
          $Actual = & (Join-Path $InstallDir "shp.exe") --version
          if ($Actual -ne $Expected) {
            throw "Expected shp version $Expected, got $Actual."
          }

  verify-publication:
    name: Verify published release metadata and assets
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release record and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/published-release"
          mkdir -p "$release_dir"

          release_json="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,body,assets)"
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null

          jq -r '.assets[].name' <<<"$release_json" | sort >"$release_dir/actual-assets.txt"
          printf '%s\n' \
            checksums.txt \
            install.ps1 \
            install.sh \
            shp-darwin-arm64.tar.gz \
            shp-linux-arm64.tar.gz \
            shp-linux-x64.tar.gz \
            shp-windows-x64.tar.gz \
            | sort >"$release_dir/expected-assets.txt"
          diff -u "$release_dir/expected-assets.txt" "$release_dir/actual-assets.txt"

          jq -r '.body' <<<"$release_json" >"$release_dir/published-notes.md"
          diff -u "docs/releases/$GITHUB_REF_NAME.md" "$release_dir/published-notes.md"

          mkdir -p "$release_dir/assets"
          gh release download "$GITHUB_REF_NAME" --dir "$release_dir/assets"
          (
            cd "$release_dir/assets"
            sha256sum --check checksums.txt
          )
          grep -q "$GITHUB_REF_NAME" "$release_dir/assets/install.sh"
          grep -q "$GITHUB_REF_NAME" "$release_dir/assets/install.ps1"
