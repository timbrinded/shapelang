name: Windows native parser probe
on:
  push:
    branches: [fix/windows-native-parser]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.14", "1.4.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-archives-0b4d205584d226d0675e30cbf0731888a4141a8c
          run-id: 36546858311
          github-token: ${{ github.token }}
          path: candidate
      - name: Compare direct and embedded native loading
        shell: pwsh
        run: |
          $binding = (Get-Item "packages/shp-checker/node_modules/@kreuzberg/tree-sitter-language-pack/ts-pack-core-node.win32-x64-msvc.node").FullName
          $env:PROBE_BINDING = $binding
          Write-Host "[DEBUG-native] Direct package with Bun $(bun --version)"
          bun -e 'const b = require(process.env.PROBE_BINDING); console.log(Object.keys(b));'
          Write-Host "[DEBUG-native] Direct binding exit $LASTEXITCODE"
          @'
          import {createRequire} from "node:module";
          const require = createRequire(import.meta.url);
          console.log(Object.keys(require("./ts-pack-core-node.win32-x64-msvc.node")));
          '@ | Set-Content native-probe.ts
          bun build native-probe.ts $binding --compile '--asset-naming=[name].[ext]' --outfile native-probe.exe
          Write-Host "[DEBUG-native] Embedded binding from checkout"
          ./native-probe.exe
          Write-Host "[DEBUG-native] Embedded checkout exit $LASTEXITCODE"
          $probeDir = Join-Path $env:RUNNER_TEMP 'native-probe'
          New-Item -ItemType Directory -Force $probeDir | Out-Null
          Copy-Item native-probe.exe $probeDir
          Push-Location $probeDir
          ./native-probe.exe
          Write-Host "[DEBUG-native] Embedded isolated exit $LASTEXITCODE"
          Pop-Location
          tar -xzf candidate/shp-windows-x64.tar.gz -C $probeDir
          & "$probeDir/shp.exe" ast source --language typescript --module generated.audit fixtures/source/audit_purge.ts
          Write-Host "[DEBUG-native] Candidate PowerShell exit $LASTEXITCODE"
          Copy-Item $binding $probeDir
          & "$probeDir/native-probe.exe"
          Write-Host "[DEBUG-native] Embedded with sidecar exit $LASTEXITCODE"
          exit 0
