name: Rule loosening

# Fails a pull request whose edits to Shape rules, traits, design memory, or
# governed paths are what let its own change pass, until a maintainer adds the
# shape-loosening-approved label. It runs apart from the main CI workflow so
# that adding or removing a label reruns only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  loosening:
    name: Rule Loosening
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Changed files
        run: bun run changed-files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Check rule loosening
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'shape-loosening-approved') }}
        run: |
          set +e
          bun run shape:loosening > loosening.log 2>&1
          status=$?
          set -e
          cat loosening.log
          # Other errors fail the Shape job; this job answers only for loosening.
          if ! grep -qx 'error: rule loosening' loosening.log; then
            echo "No rule loosening (check exit $status)."
            exit 0
          fi
          if [ "$APPROVED" = "true" ]; then
            echo "::notice title=Rule loosening approved::A maintainer approved the loosening above with the shape-loosening-approved label."
            exit 0
          fi
          echo "::error title=Rule loosening::An edit to the Shape rules is what lets this change pass. Restore the rule, or, if a person asked for it, have a maintainer add the shape-loosening-approved label."
          exit 1
