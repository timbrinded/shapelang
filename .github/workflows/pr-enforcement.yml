name: PR Shape enforcement
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: shape-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    name: PR Shape Evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check exact transition and current PR body
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          SHAPE_OUTPUT_DIR: ${{ runner.temp }}/shape-enforcement
        run: |
          shape_status=0
          bun scripts/check-pr.ts || shape_status=$?
          bun scripts/report-pr-check.ts "$shape_status"
          exit "$shape_status"
      - name: Publish deterministic result
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/shape-enforcement/check.md"; then
            cat "$RUNNER_TEMP/shape-enforcement/check.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shape-enforcement-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/shape-enforcement
          if-no-files-found: error

  semantic:
    name: Jev Semantic Review
    # Enable only for repositories whose branch authors may use these API keys.
    # Never use pull_request_target to execute untrusted candidate code.
    if: ${{ always() && vars.SHAPE_JEV_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: shape-enforcement-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/shape-enforcement
      - name: Review exact source and PR claims with Jev
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SHAPE_OUTPUT_DIR: ${{ runner.temp }}/shape-enforcement
          JEV_MODEL: ${{ vars.SHAPE_JEV_MODEL || 'jev-latest' }}
          JEV_THRESHOLD: ${{ vars.SHAPE_JEV_THRESHOLD || '0.9' }}
          JEV_FAILURE_POLICY: ${{ vars.SHAPE_JEV_FAILURE_POLICY || 'warn' }}
          JEV_REVIEW_POLICY: ${{ vars.SHAPE_JEV_REVIEW_POLICY || 'warn' }}
        run: bun scripts/run-jev-enforcement.ts
      - name: Publish recommendations
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/shape-enforcement/recommendations.md"; then
            cat "$RUNNER_TEMP/shape-enforcement/recommendations.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shape-jev-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/shape-enforcement
  # Require the deterministic job independently in branch protection. The semantic
  # job can separately block contradictions; no probability can turn a deterministic failure green.

  live-canary:
    name: Jev Live Canary
    if: ${{ vars.SHAPE_JEV_CANARY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Exercise live positive and negative semantic gates
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SHAPE_OUTPUT_DIR: ${{ runner.temp }}/shape-jev-canary
          JEV_MODEL: ${{ vars.SHAPE_JEV_MODEL || 'jev-latest' }}
        run: bun run jev:canary
      - name: Publish canary evidence
        if: always()
        run: |
          for report in "$RUNNER_TEMP"/shape-jev-canary/*/recommendations.md; do
            if test -f "$report"; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shape-jev-canary-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/shape-jev-canary
          if-no-files-found: error
          retention-days: 7
