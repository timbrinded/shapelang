name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  codegen:
    name: Codegen
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - &install
        name: Install
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Langium artifacts
        run: bun run langium:generate

      - name: Check generated artifacts
        run: git diff --exit-code -- packages/shp-checker/src/language/generated

      - name: Check generated AST context
        run: bun run ast:check

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Format check
        run: bun run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Tests
        run: bun test

  shape:
    name: Shape
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Changed files
        run: bun run changed-files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Shape CI
        run: bun run shape:ci

  shape-claude-review:
    name: Shape Claude Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    env:
      SHAPE_CONTRACT_RESULT_SCHEMA: .github/shape-contract/schemas/shape-contract-result.schema.json

    steps:
      - name: Detect Claude credentials
        id: claude-token
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Claude Shape contract review because no Anthropic API credential is available."
          fi

      - name: Checkout
        if: steps.claude-token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: steps.claude-token.outputs.available == 'true'
        id: setup-bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        if: steps.claude-token.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - name: Changed files
        if: steps.claude-token.outputs.available == 'true'
        run: bun run changed-files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Shape diagnostics for Claude
        if: steps.claude-token.outputs.available == 'true'
        run: |
          set +e
          {
            echo "## changed.txt"
            sed -n '1,200p' changed.txt
            echo
            echo "## bun run shape:ci"
            bun run shape:ci
            status=$?
            echo
            echo "shape_ci_exit=$status"
          } > shape-claude-context.txt 2>&1

      - name: Load structured output schema
        id: schema
        if: steps.claude-token.outputs.available == 'true'
        env:
          SCHEMA_PATH: ${{ env.SHAPE_CONTRACT_RESULT_SCHEMA }}
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const schema = JSON.stringify(JSON.parse(readFileSync(process.env.SCHEMA_PATH, "utf8")));
          appendFileSync(process.env.GITHUB_OUTPUT, `json_schema=${schema}\n`);
          NODE

      - name: Install Claude Code
        if: steps.claude-token.outputs.available == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Run Claude Shape contract review
        id: claude
        if: steps.claude-token.outputs.available == 'true'
        env:
          API_TIMEOUT_MS: 18000
          DISABLE_NON_ESSENTIAL_MODE_CALLS: 1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: ${{ secrets.CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.sha }}
          JSON_SCHEMA: ${{ steps.schema.outputs.json_schema }}
        run: |
          set -euo pipefail

          prompt=$(cat <<'PROMPT'
          Read AGENTS.md when it exists, then read
          .github/prompts/shape-contract-review.md.

          Analyze this repository for Shape contract drift.
          Scope: BASE_REF=${{ github.base_ref || '' }},
          HEAD_SHA=${{ github.sha }}.
          Changed files are listed in changed.txt.
          Shape command output is in shape-claude-context.txt.
          Use the prompt file's review policy and output contract.
          Return the final review as a single JSON object matching
          ${{ env.SHAPE_CONTRACT_RESULT_SCHEMA }}. Do not include prose,
          Markdown, or code fences outside that object. Do not modify tracked
          repository files.
          PROMPT
          )

          claude -p "$prompt" \
            --max-turns 100 \
            --output-format json \
            --allowedTools "Read,Glob,Grep,LS,Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git ls-files *),Bash(bun run shape:ci),Bash(bun shp --help),Bash(bun shp check *),Bash(bun shp obligations *),Bash(bun shp memory *),Bash(bun shp explain *),Bash(bun shp analyze *),Bash(rg *),Bash(sed -n *),Bash(ls *),Bash(pwd)" \
            --disallowedTools "Write,Edit" \
            --json-schema "$JSON_SCHEMA" \
            > claude-shape-review.json

          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");

          const parseJsonValue = (value) => {
            if (typeof value !== "string") {
              return value;
            }
            const trimmed = value.trim();
            const candidates = [trimmed];
            const fenced = trimmed.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/);
            if (fenced?.[1]) {
              candidates.push(fenced[1].trim());
            }
            const start = value.indexOf("{");
            const end = value.lastIndexOf("}");
            if (start !== -1 && end > start) {
              candidates.push(value.slice(start, end + 1));
            }
            for (const candidate of candidates) {
              try {
                return JSON.parse(candidate);
              } catch {
                // Try the next representation.
              }
            }
            return undefined;
          };

          const isShapeReview = (value) =>
            value !== null &&
            typeof value === "object" &&
            !Array.isArray(value) &&
            typeof value.status === "string" &&
            typeof value.summary === "string" &&
            Array.isArray(value.findings);

          const result = JSON.parse(readFileSync("claude-shape-review.json", "utf8"));
          const candidates = [
            ["structured_output", result.structured_output],
            ["result", parseJsonValue(result.result)],
            ["direct", result],
          ];
          const selected = candidates.find(([, value]) => isShapeReview(value));
          if (!selected) {
            console.error("Claude output did not include a valid Shape review object.");
            console.error(JSON.stringify({
              type: result.type,
              subtype: result.subtype,
              session_id: result.session_id,
              keys: Object.keys(result),
              result_preview: typeof result.result === "string" ? result.result.slice(0, 500) : undefined,
            }, null, 2));
            process.exit(1);
          }
          const [source, review] = selected;
          const structuredOutput = JSON.stringify(review);
          console.log(`Claude structured output source: ${source}`);
          console.log(`Claude structured output fields: ${Object.keys(review).join(", ")}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `structured_output=${structuredOutput}\n`);
          NODE

      - name: Check Claude review result
        if: steps.claude-token.outputs.available == 'true'
        env:
          CLAUDE_SHAPE_REVIEW_RESULT: ${{ steps.claude.outputs.structured_output }}
        run: node .github/scripts/check-claude-shape-review.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Docs check
        run: bun run docs:check

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Build release assets
        run: bun run build:release

      - name: Smoke test release binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/shp-smoke
          tar -xzf dist/release/shp-linux-x64.tar.gz -C /tmp/shp-smoke
          /tmp/shp-smoke/shp --help >/dev/null
          /tmp/shp-smoke/shp check
          /tmp/shp-smoke/shp ast source \
            --language typescript \
            --module generated.audit \
            fixtures/source/audit_purge.ts \
            >/tmp/shp-smoke/ast-source.shape
          grep -q "GeneratedAstAnchor" /tmp/shp-smoke/ast-source.shape
          grep -q "kind generated_from" /tmp/shp-smoke/ast-source.shape
          cat > /tmp/shp-smoke/widget.tsx <<'EOF'
          export function Widget() {
            return <section>audit</section>;
          }
          EOF
          /tmp/shp-smoke/shp ast source \
            --module generated.widget \
            /tmp/shp-smoke/widget.tsx \
            >/tmp/shp-smoke/ast-source-tsx.shape
          grep -q "GeneratedAstAnchor" /tmp/shp-smoke/ast-source-tsx.shape
          /tmp/shp-smoke/shp memory >/dev/null
          /tmp/shp-smoke/shp obligations >/tmp/shp-smoke/obligations.txt
          grep -q "No open shape obligations." /tmp/shp-smoke/obligations.txt

          set +e
          /tmp/shp-smoke/shp analyze \
            --shape-files fixtures/pass/append_only_append/audit.shape \
            fixtures/source/audit_purge.ts \
            >/tmp/shp-smoke/analyze.out \
            2>/tmp/shp-smoke/analyze.err
          analyze_status=$?
          set -e
          if [ "$analyze_status" -ne 1 ]; then
            echo "Expected analyzer smoke test to report a mismatch, got exit $analyze_status."
            cat /tmp/shp-smoke/analyze.out
            cat /tmp/shp-smoke/analyze.err >&2
            exit 1
          fi
          grep -q "HardDelete" /tmp/shp-smoke/analyze.err

  links:
    name: Links
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --fallback-extensions md
            --exclude-path node_modules
            --exclude-path dist
            --exclude-path docs-site/dist
            --exclude-path docs-site/.astro
            .
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  typos:
    name: Typos
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Check typos
        uses: crate-ci/typos@v1
