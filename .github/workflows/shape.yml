name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  codegen:
    name: Codegen
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - &install
        name: Install
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Langium artifacts
        run: bun run langium:generate

      - name: Check generated artifacts
        run: git diff --exit-code -- packages/shp-checker/src/language/generated

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Format check
        run: bun run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Tests
        run: bun test

  shape:
    name: Shape
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Changed files
        run: bun run changed-files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Shape CI
        run: bun run shape:ci

  shape-copilot-review:
    name: Shape Copilot Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Detect Copilot token
        id: copilot-token
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Copilot Shape contract review because COPILOT_GITHUB_TOKEN is not available."
          fi

      - name: Checkout
        if: steps.copilot-token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: steps.copilot-token.outputs.available == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install
        if: steps.copilot-token.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - name: Setup Node
        if: steps.copilot-token.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Copilot CLI
        if: steps.copilot-token.outputs.available == 'true'
        run: npm install -g @github/copilot

      - name: Changed files
        if: steps.copilot-token.outputs.available == 'true'
        run: bun run changed-files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Shape diagnostics for Copilot
        if: steps.copilot-token.outputs.available == 'true'
        run: |
          set +e
          {
            echo "## changed.txt"
            sed -n '1,200p' changed.txt
            echo
            echo "## bun run shape:ci"
            bun run shape:ci
            status=$?
            echo
            echo "shape_ci_exit=$status"
          } > shape-copilot-context.txt 2>&1

      - name: Run Copilot Shape contract review
        if: steps.copilot-token.outputs.available == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prompt="$(<.github/prompts/shape-contract-review.md)"
          prompt="$prompt

          CI context:
          - Base ref: ${GITHUB_BASE_REF:-unknown}
          - Head SHA: ${GITHUB_SHA:-unknown}
          - Changed files are listed in changed.txt.
          - Shape command output is in shape-copilot-context.txt.
          - Write the final JSON object to copilot-shape-review.json."

          copilot -p "$prompt" \
            --allow-tool='read,write(copilot-shape-review.json),shell(git:*),shell(bun:*),shell(rg:*),shell(ls:*),shell(pwd)' \
            --deny-tool='shell(git push),shell(git commit),shell(git reset),shell(git checkout)' \
            --no-ask-user

      - name: Check Copilot review result
        if: steps.copilot-token.outputs.available == 'true'
        run: node .github/scripts/check-copilot-shape-review.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Docs check
        run: bun run docs:check

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Build release assets
        run: bun run build:release

      - name: Smoke test release binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/shp-smoke
          tar -xzf dist/release/shp-linux-x64.tar.gz -C /tmp/shp-smoke
          /tmp/shp-smoke/shp --help >/dev/null
          /tmp/shp-smoke/shp check
          /tmp/shp-smoke/shp memory >/dev/null
          /tmp/shp-smoke/shp obligations >/tmp/shp-smoke/obligations.txt
          grep -q "No open shape obligations." /tmp/shp-smoke/obligations.txt

          set +e
          /tmp/shp-smoke/shp analyze \
            --shape-files fixtures/pass/append_only_append/audit.shape \
            fixtures/source/audit_purge.ts \
            >/tmp/shp-smoke/analyze.out \
            2>/tmp/shp-smoke/analyze.err
          analyze_status=$?
          set -e
          if [ "$analyze_status" -ne 1 ]; then
            echo "Expected analyzer smoke test to report a mismatch, got exit $analyze_status."
            cat /tmp/shp-smoke/analyze.out
            cat /tmp/shp-smoke/analyze.err >&2
            exit 1
          fi
          grep -q "HardDelete" /tmp/shp-smoke/analyze.err

  links:
    name: Links
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --fallback-extensions md
            --exclude-path node_modules
            --exclude-path dist
            --exclude-path docs-site/dist
            --exclude-path docs-site/.astro
            .
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  typos:
    name: Typos
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Check typos
        uses: crate-ci/typos@v1
