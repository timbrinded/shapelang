name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  codegen:
    name: Codegen
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - &install
        name: Install
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Langium artifacts
        run: bun run langium:generate

      - name: Check generated artifacts
        run: git diff --exit-code -- packages/shp-checker/src/language/generated

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Format check
        run: bun run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Tests
        run: bun test

  shape:
    name: Shape
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Shape conformance
        run: bun shp check

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Docs check
        run: bun run docs:check

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *install

      - name: Build release assets
        run: bun run build:release

      - name: Smoke test release binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/shp-smoke
          tar -xzf dist/release/shp-linux-x64.tar.gz -C /tmp/shp-smoke
          /tmp/shp-smoke/shp --help >/dev/null
          /tmp/shp-smoke/shp check

  links:
    name: Links
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --fallback-extensions md
            --exclude-path node_modules
            --exclude-path dist
            --exclude-path docs-site/dist
            --exclude-path docs-site/.astro
            .
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  typos:
    name: Typos
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Check typos
        uses: crate-ci/typos@v1
