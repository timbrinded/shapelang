name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  codegen:
    name: Codegen
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - &bun-cache
        name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - &install
        name: Install
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Langium artifacts
        run: bun run langium:generate

      - name: Check generated artifacts
        run: git diff --exit-code -- packages/shp-checker/src/language/generated

      - name: Check generated AST context
        run: bun run ast:check

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *bun-cache
      - *install

      - name: Format check
        run: bun run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *bun-cache
      - *install

      - name: Lint
        run: bun run lint

      - name: Validate shipped skills
        run: bun run skills:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *bun-cache
      - *install

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *bun-cache
      - *install

      - name: Tests
        run: bun test

  semantic-kernel:
    name: Semantic Kernel Prototype
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *bun-cache
      - *install

      - name: Cache Rust prototype
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            experiments/semantic-kernel/target
          key: semantic-kernel-${{ runner.os }}-${{ hashFiles('experiments/semantic-kernel/Cargo.lock', 'experiments/semantic-kernel/rust-toolchain.toml', 'experiments/semantic-kernel/scripts/install-wasm-bindgen.sh') }}
          restore-keys: |
            semantic-kernel-${{ runner.os }}-

      - name: Resolve pinned Rust toolchain
        working-directory: experiments/semantic-kernel
        run: rustup show active-toolchain

      - name: Check native semantic kernel
        run: bun run kernel:check

      - name: Build native and browser WASM kernels
        run: bun run kernel:build

      - name: Run native and browser WASM E2E
        run: bun run kernel:e2e

      - name: Upload browser WASM prototype
        uses: actions/upload-artifact@v4
        with:
          name: semantic-kernel-wasm-${{ github.sha }}
          path: |
            experiments/semantic-kernel/target/wasm-web/*.js
            experiments/semantic-kernel/target/wasm-web/*.d.ts
            experiments/semantic-kernel/target/wasm-web/*.wasm
          if-no-files-found: error
          retention-days: 7

  shape:
    name: Shape
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *bun-cache
      - *install

      - name: Changed files
        run: bun run changed-files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Shape CI
        run: bun run shape:ci

  shape-claude-review:
    name: Shape Claude Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      claude_available: ${{ steps.claude-token.outputs.available }}

    steps:
      - &detect-claude
        name: Detect Claude credentials
        id: claude-token
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Claude-powered Shape job because no Anthropic API credential is available."
          fi

      - name: Checkout
        if: steps.claude-token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Shape contract review
        if: steps.claude-token.outputs.available == 'true'
        uses: ./.github/actions/claude-skill-review
        with:
          skill: review
          prepare-command: |
            set +e
            {
              echo "## changed.txt"
              sed -n '1,200p' changed.txt
              echo
              echo "## bun run shape:ci"
              bun run shape:ci
              status=$?
              echo
              echo "shape_ci_exit=$status"
            } > shape-claude-context.txt 2>&1
        env:
          API_TIMEOUT_MS: 18000
          DISABLE_NON_ESSENTIAL_MODE_CALLS: 1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: ${{ secrets.CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

  shape-guard:
    name: Shape Contract Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - *detect-claude

      - name: Checkout
        if: steps.claude-token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Shape contract guard
        if: steps.claude-token.outputs.available == 'true'
        uses: ./.github/actions/claude-skill-review
        with:
          skill: guard
        env:
          API_TIMEOUT_MS: 18000
          DISABLE_NON_ESSENTIAL_MODE_CALLS: 1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

  shape-index:
    name: Shape Index Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - *detect-claude

      - name: Checkout
        if: steps.claude-token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Shape index coverage audit
        if: steps.claude-token.outputs.available == 'true'
        uses: ./.github/actions/claude-skill-review
        with:
          skill: index
        env:
          API_TIMEOUT_MS: 18000
          DISABLE_NON_ESSENTIAL_MODE_CALLS: 1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          SHAPE_INDEX_STRICT: ${{ vars.SHAPE_INDEX_STRICT }}

  shape-pr-comment:
    name: Shape PR Summary Comment
    runs-on: ubuntu-latest
    needs:
      - shape
      - shape-claude-review
      - shape-guard
      - shape-index
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upsert Shape CI summary comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHAPE_RESULT: ${{ needs.shape.result }}
          SHAPE_CLAUDE_REVIEW_RESULT: ${{ needs['shape-claude-review'].result }}
          SHAPE_GUARD_RESULT: ${{ needs['shape-guard'].result }}
          SHAPE_INDEX_RESULT: ${{ needs['shape-index'].result }}
          CLAUDE_AVAILABLE: ${{ needs['shape-claude-review'].outputs.claude_available }}
        run: node .github/scripts/upsert-shape-ci-comment.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *bun-cache
      - *install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Docs check
        run: bun run docs:check

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-bun
      - *bun-cache
      - *install

      - name: Build release assets
        run: bun run build:release

      - name: Smoke test release binary
        run: |
          version="$(bun -e 'console.log(require("./packages/shp-cli/package.json").version)')"
          scripts/smoke-release-binary.sh --expected-version "$version" dist/release/shp-linux-x64.tar.gz

  links:
    name: Links
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --fallback-extensions md
            --exclude-path node_modules
            --exclude-path dist
            --exclude-path docs-site/dist
            --exclude-path docs-site/.astro
            .
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  typos:
    name: Typos
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Check typos
        uses: crate-ci/typos@v1
