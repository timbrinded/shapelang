<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" role="img" aria-labelledby="t d">
  <title id="t">Who decides</title>
  <desc id="d">Drafts, analyzer hints, and critic advisories inform the author; only shp check --changed-files accepts or rejects the Shape model. Generated drafts under shape/generated/ast are loaded into the Shape model as candidate context, with unknown effects allowed.</desc>
  <style>
    .paper{fill:#f6f4ee}.grid{stroke:#e6e1d4}.gridM{stroke:#dbd4c4}
    .ink{fill:#1d2b34}.inkS{stroke:#1d2b34}.mute{fill:#5d6c74}.muteS{stroke:#8a959a}
    .rule{stroke:#b8b09f}.card{fill:#fffdf8;stroke:#1d2b34}.band{fill:#0b6e99;fill-opacity:.1}
    .blue{fill:#0b6e99}.blueS{stroke:#0b6e99}.pass{fill:#16734b}.passS{stroke:#16734b}
    .warn{fill:#8f5a0c}.warnS{stroke:#b7791f}.fail{fill:#c23b32}.failS{stroke:#c23b32}.hatch{stroke:#c9c1ae}
    .markBg{fill:#101820}.markA{fill:#45c4b0}.markB{fill:#f4b942}
    .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    @media (prefers-color-scheme:dark){
      .paper{fill:#0c1a23}.grid{stroke:#13252f}.gridM{stroke:#1a303c}
      .ink{fill:#dbe7ec}.inkS{stroke:#dbe7ec}.mute{fill:#8fa4ae}.muteS{stroke:#6f8792}
      .rule{stroke:#35505e}.card{fill:#10222d;stroke:#dbe7ec}.band{fill:#5bb8e6;fill-opacity:.12}
      .blue{fill:#5bb8e6}.blueS{stroke:#5bb8e6}.pass{fill:#46c28b}.passS{stroke:#46c28b}
      .warn{fill:#e0a33a}.warnS{stroke:#e0a33a}.fail{fill:#ec6a5f}.failS{stroke:#ec6a5f}.hatch{stroke:#233946}
      .markBg{fill:#dbe7ec}
    }
  </style>
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" class="grid" stroke-width=".6"/></pattern>
    <pattern id="gM" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" class="gridM" stroke-width=".8"/></pattern>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" class="hatch" stroke-width="1.1"/></pattern>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="blue"/></marker>
    <marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="fail"/></marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" class="ink"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="mute"/></marker>
  </defs>

  <!-- plate -->
  <rect width="960" height="544" class="paper"/>
  <rect width="960" height="544" fill="url(#g)"/>
  <rect width="960" height="544" fill="url(#gM)"/>
  <rect x="10.5" y="10.5" width="939" height="523" fill="none" class="inkS" stroke-width="1"/>
  <rect x="14.5" y="14.5" width="931" height="515" fill="none" class="rule" stroke-width=".6"/>

  <!-- inputs -->
  <text x="40" y="52" class="mono mute" font-size="11" letter-spacing="1.6">INPUTS</text>
  <g class="card" stroke-width="1">
    <rect x="40" y="112" width="112" height="30"/>
    <rect x="40" y="154" width="112" height="30" stroke-dasharray="3 2"/>
    <rect x="40" y="200" width="112" height="160"/>
  </g>
  <g class="mono ink" font-size="12">
    <text x="96" y="132" text-anchor="middle">pr.diff</text>
    <text x="96" y="174" text-anchor="middle">changed.txt</text>
    <text x="52" y="222">source code</text>
  </g>
  <path d="M52 248h70M52 264h84M64 280h56M64 296h72M52 312h48M64 328h64M52 344h40" class="muteS" stroke-width="3" stroke-linecap="round" opacity=".55"/>

  <!-- advisory tools -->
  <text x="184" y="52" class="mono blue" font-size="11" letter-spacing="1.6">ADVISORY</text>
  <text x="184" y="76" class="sans ink" font-size="19" font-weight="650">Informs the author</text>
  <g class="card" stroke-width="1.2">
    <rect x="184" y="112" width="240" height="72"/>
    <rect x="184" y="200" width="240" height="72"/>
    <rect x="184" y="288" width="240" height="72"/>
  </g>
  <g class="mono ink" font-size="12.5" font-weight="700">
    <text x="200" y="137">shp author</text>
    <text x="200" y="225">shp analyze</text>
    <text x="200" y="313">shp ast source</text>
  </g>
  <g class="mono mute" font-size="11.5">
    <text x="200" y="157">draft · prompt ·</text>
    <text x="200" y="173">critic advisories</text>
    <text x="200" y="245">hints / warnings</text>
    <text x="200" y="333">generated drafts</text>
    <text x="200" y="349" class="warn">(effects unknown)</text>
  </g>
  <g fill="none" class="muteS" stroke-width="1.2">
    <path d="M152 127C168 127 168 144 180 144" marker-end="url(#aM)"/>
    <path d="M152 169C168 169 168 152 180 152" marker-end="url(#aM)"/>
    <path d="M152 236H180" marker-end="url(#aM)"/>
    <path d="M152 324H180" marker-end="url(#aM)"/>
  </g>

  <!-- author -->
  <rect x="480" y="112" width="160" height="64" class="card" stroke-width="1"/>
  <text x="496" y="135" class="mono ink" font-size="12.5" font-weight="700">shp lsp</text>
  <g class="mono mute" font-size="11.5">
    <text x="496" y="153">checker diagnostics</text>
    <text x="496" y="168">in the editor</text>
  </g>
  <path d="M560 176V206" class="muteS" stroke-width="1.2" marker-end="url(#aM)"/>

  <rect x="480" y="212" width="160" height="48" rx="24" class="card" stroke-width="1.4"/>
  <text x="560" y="241" class="mono ink" font-size="12.5" text-anchor="middle">author / reviewer</text>
  <g fill="none" class="muteS" stroke-width="1.2">
    <path d="M424 148C456 148 448 228 476 228" marker-end="url(#aM)"/>
    <path d="M424 236H476" marker-end="url(#aM)"/>
    <path d="M424 324C456 324 448 244 476 244" marker-end="url(#aM)"/>
  </g>

  <!-- shape model -->
  <rect x="456.5" y="296.5" width="208" height="160" fill="none" class="inkS" stroke-width="1"/>
  <text x="468" y="314" class="mono ink" font-size="11" letter-spacing="1.6">SHAPE MODEL</text>
  <path d="M600 260V324" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="612" y="288" class="mono blue" font-size="11.5">writes</text>
  <rect x="472" y="328" width="176" height="36" class="card" stroke-width="1.2"/>
  <text x="560" y="351" class="mono ink" font-size="12" text-anchor="middle">authored .shape</text>
  <rect x="472" y="380" width="176" height="60" class="card warnS" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="560" y="405" class="mono ink" font-size="12" text-anchor="middle">generated drafts</text>
  <text x="560" y="423" class="mono warn" font-size="11.5" text-anchor="middle">effects unknown</text>
  <text x="456" y="476" class="mono mute" font-size="11.5">shape/**/*.shape</text>

  <path d="M392 360V410H468" fill="none" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <g class="mono blue" font-size="11.5">
    <text x="184" y="388">shape/generated/ast:</text>
    <text x="184" y="404">loaded as candidate</text>
    <text x="184" y="420">context, unknowns allowed</text>
  </g>

  <!-- gate -->
  <path d="M676 15V529" class="inkS" stroke-width="1.2" stroke-dasharray="7 5"/>
  <path d="M664 320H684" class="blueS" stroke-width="1.6" marker-end="url(#aB)"/>
  <text x="688" y="256" class="mono blue" font-size="11" letter-spacing="1.6">THE ONLY GATE</text>
  <text x="688" y="280" class="sans ink" font-size="19" font-weight="650">shp check decides</text>
  <rect x="688" y="304" width="232" height="32" class="card" stroke-width="1"/>
  <text x="704" y="325" class="mono ink" font-size="12">shp fmt --check</text>
  <text x="908" y="325" class="mono mute" font-size="11.5" text-anchor="end">formatting</text>
  <path d="M804 336V356" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <rect x="688" y="360" width="232" height="56" class="card" stroke-width="1.6"/>
  <text x="704" y="382" class="mono ink" font-size="13" font-weight="700">shp check</text>
  <text x="704" y="403" class="mono ink" font-size="12">--changed-files changed.txt</text>

  <path d="M752 416C752 428 744 430 744 436" fill="none" class="passS" stroke-width="1.4"/>
  <path d="M856 416C856 428 864 430 864 436" fill="none" class="failS" stroke-width="1.6"/>
  <g class="mono" font-size="12.5">
    <circle cx="744" cy="446" r="10" fill="none" class="passS" stroke-width="1.4"/>
    <path d="M739 446l4 4 6-8" fill="none" class="passS" stroke-width="1.6"/>
    <text x="762" y="450" class="pass">pass</text>
    <circle cx="864" cy="446" r="10" fill="none" class="failS" stroke-width="1.6"/>
    <path d="M859 441l10 10M869 441l-10 10" class="failS" stroke-width="1.6"/>
    <text x="882" y="450" class="fail">fail</text>
  </g>

  <!-- title block -->
  <g transform="translate(700 484)">
    <rect x=".5" y=".5" width="235" height="34" fill="none" class="inkS" stroke-width="1"/>
    <path d="M40 .5V34.5" class="inkS" stroke-width="1"/>
    <rect x="9" y="6" width="23" height="23" rx="5" class="markBg"/>
    <path d="M14.8 12.5h5.8l5.8 5-5.8 5h-5.8l5.8-5z" class="markA"/>
    <path d="M20.6 12.5h5.8v10h-5.8l5.8-5z" class="markB"/>
    <text x="52" y="22" class="mono ink" font-size="11" letter-spacing=".6">who decides</text>
  </g>
</svg>
