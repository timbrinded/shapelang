<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" role="img" aria-labelledby="t d">
  <title id="t">How effect model declarations connect</title>
  <desc id="d">The prelude trait AppendOnly applies to the resource AuditEvent and finally forbids HardDelete, Truncate, and DropStorage. The component AuditStore owns AuditEvent, grants Append of AuditEvent, and contains the function appendEvent. The function declares the effect Append of AuditEvent in its complete effect list, and that effect targets AuditEvent. The function's source and the effect's evidence both point at ts("src/audit/store.ts#appendEvent"). The relation GatewayCallsAudit, of kind calls, connects the component Gateway to AuditStore as a top-level declaration outside any component.</desc>
  <style>
    .paper{fill:#f6f4ee}.grid{stroke:#e6e1d4}.gridM{stroke:#dbd4c4}
    .ink{fill:#1d2b34}.inkS{stroke:#1d2b34}.mute{fill:#5d6c74}.muteS{stroke:#8a959a}
    .rule{stroke:#b8b09f}.card{fill:#fffdf8;stroke:#1d2b34}.band{fill:#0b6e99;fill-opacity:.1}
    .blue{fill:#0b6e99}.blueS{stroke:#0b6e99}.pass{fill:#16734b}.passS{stroke:#16734b}
    .warn{fill:#8f5a0c}.warnS{stroke:#b7791f}.fail{fill:#c23b32}.failS{stroke:#c23b32}.hatch{stroke:#c9c1ae}
    .markBg{fill:#101820}.markA{fill:#45c4b0}.markB{fill:#f4b942}
    .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    @media (prefers-color-scheme:dark){
      .paper{fill:#0c1a23}.grid{stroke:#13252f}.gridM{stroke:#1a303c}
      .ink{fill:#dbe7ec}.inkS{stroke:#dbe7ec}.mute{fill:#8fa4ae}.muteS{stroke:#6f8792}
      .rule{stroke:#35505e}.card{fill:#10222d;stroke:#dbe7ec}.band{fill:#5bb8e6;fill-opacity:.12}
      .blue{fill:#5bb8e6}.blueS{stroke:#5bb8e6}.pass{fill:#46c28b}.passS{stroke:#46c28b}
      .warn{fill:#e0a33a}.warnS{stroke:#e0a33a}.fail{fill:#ec6a5f}.failS{stroke:#ec6a5f}.hatch{stroke:#233946}
      .markBg{fill:#dbe7ec}
    }
  </style>
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" class="grid" stroke-width=".6"/></pattern>
    <pattern id="gM" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" class="gridM" stroke-width=".8"/></pattern>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" class="hatch" stroke-width="1.1"/></pattern>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="blue"/></marker>
    <marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="fail"/></marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" class="ink"/></marker>
  </defs>

  <!-- plate -->
  <rect width="960" height="544" class="paper"/>
  <rect width="960" height="544" fill="url(#g)"/>
  <rect width="960" height="544" fill="url(#gM)"/>
  <rect x="10.5" y="10.5" width="939" height="523" fill="none" class="inkS" stroke-width="1"/>
  <rect x="14.5" y="14.5" width="931" height="515" fill="none" class="rule" stroke-width=".6"/>

  <text x="40" y="52" class="mono blue" font-size="11" letter-spacing="1.6">EFFECT MODEL</text>
  <text x="40" y="76" class="sans ink" font-size="19" font-weight="650">How the declarations connect</text>

  <!-- trait -->
  <rect x="40" y="112" width="224" height="120" class="card" stroke-width="1.2"/>
  <text x="56" y="131" class="mono mute" font-size="11">trait · prelude</text>
  <text x="56" y="151" class="mono ink" font-size="13" font-weight="700">AppendOnly</text>
  <path d="M52 164H252" class="rule" stroke-width=".8"/>
  <g class="mono fail" font-size="11.5">
    <text x="56" y="184">forbid final HardDelete&lt;T&gt;</text>
    <text x="56" y="201">forbid final Truncate&lt;T&gt;</text>
    <text x="56" y="218">forbid final DropStorage&lt;T&gt;</text>
  </g>

  <!-- resource -->
  <rect x="528" y="112" width="176" height="48" class="card" stroke-width="1.2"/>
  <text x="544" y="130" class="mono mute" font-size="11">resource</text>
  <text x="544" y="150" class="mono ink" font-size="13" font-weight="700">AuditEvent</text>

  <!-- applied to -->
  <path d="M264 136H524" fill="none" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="396" y="128" class="mono ink" font-size="11.5" text-anchor="middle">applied to</text>
  <text x="396" y="154" class="mono mute" font-size="11.5" text-anchor="middle">resource AuditEvent : AppendOnly</text>

  <!-- component boundary -->
  <rect x="288" y="240" width="304" height="160" class="card" stroke-width="1.4"/>
  <rect x="288.7" y="240.7" width="302.6" height="42" class="band"/>
  <text x="304" y="258" class="mono mute" font-size="11">component</text>
  <text x="304" y="275" class="mono ink" font-size="13" font-weight="700">AuditStore</text>

  <!-- fn inside the component -->
  <rect x="384" y="312" width="176" height="48" class="card" stroke-width="1"/>
  <text x="400" y="330" class="mono mute" font-size="11">fn</text>
  <text x="400" y="350" class="mono ink" font-size="13" font-weight="700">appendEvent</text>

  <!-- owns -->
  <path d="M568 240V164" fill="none" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="576" y="200" class="mono ink" font-size="11.5">owns</text>
  <text x="576" y="215" class="mono mute" font-size="11">name-checked only</text>

  <!-- effect -->
  <rect x="736" y="296" width="184" height="48" class="card" stroke-width="1.2"/>
  <text x="752" y="314" class="mono mute" font-size="11">effect</text>
  <text x="752" y="334" class="mono ink" font-size="13" font-weight="700">Append&lt;AuditEvent&gt;</text>

  <!-- grants -->
  <path d="M592 264H828V292" fill="none" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="704" y="257" class="mono ink" font-size="11.5" text-anchor="middle">grants</text>

  <!-- declares -->
  <path d="M560 336H732" fill="none" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="664" y="329" class="mono ink" font-size="11.5" text-anchor="middle">declares</text>
  <text x="664" y="353" class="mono mute" font-size="11.5" text-anchor="middle">(effects complete)</text>

  <!-- targets -->
  <path d="M896 296V136H708" fill="none" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="800" y="129" class="mono ink" font-size="11.5" text-anchor="middle">targets</text>

  <!-- source ref -->
  <rect x="368" y="440" width="288" height="48" class="card" stroke-width="1"/>
  <text x="384" y="458" class="mono mute" font-size="11">source ref</text>
  <text x="384" y="478" class="mono ink" font-size="12">ts("src/audit/store.ts#appendEvent")</text>
  <g fill="none" class="muteS" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#dot)">
    <path d="M472 360V437"/>
    <path d="M828 344V464H659"/>
  </g>
  <text x="480" y="424" class="mono ink" font-size="11.5">source</text>
  <text x="744" y="457" class="mono ink" font-size="11.5" text-anchor="middle">evidence</text>

  <!-- top-level relation, outside the component -->
  <rect x="40" y="320" width="96" height="48" class="card" stroke-width="1.2"/>
  <text x="52" y="338" class="mono mute" font-size="11">component</text>
  <text x="52" y="358" class="mono ink" font-size="13" font-weight="700">Gateway</text>
  <path d="M136 344H284" fill="none" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="212" y="321" class="mono mute" font-size="11" text-anchor="middle">relation (top level)</text>
  <text x="212" y="337" class="mono ink" font-size="11.5" text-anchor="middle">GatewayCallsAudit</text>
  <text x="212" y="361" class="mono mute" font-size="11" text-anchor="middle">kind calls</text>

  <!-- title block -->
  <g transform="translate(700 484)">
    <rect x=".5" y=".5" width="235" height="34" fill="none" class="inkS" stroke-width="1"/>
    <path d="M40 .5V34.5" class="inkS" stroke-width="1"/>
    <rect x="9" y="6" width="23" height="23" rx="5" class="markBg"/>
    <path d="M14.8 12.5h5.8l5.8 5-5.8 5h-5.8l5.8-5z" class="markA"/>
    <path d="M20.6 12.5h5.8v10h-5.8l5.8-5z" class="markB"/>
    <text x="52" y="22" class="mono ink" font-size="11" letter-spacing=".6">effect model</text>
  </g>
</svg>
