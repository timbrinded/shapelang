<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" role="img" aria-labelledby="t d">
  <title id="t">Checker pipeline</title>
  <desc id="d">shp check parses every file, lowers the modules into one Model, runs the semantic checks and then bindings, sorts the diagnostics, and exits 0, 1, or 2. A file that fails to parse or read stops the run with exit 2 before any Model exists; the shp CLI formats the result.</desc>
  <style>
    .paper{fill:#f6f4ee}.grid{stroke:#e6e1d4}.gridM{stroke:#dbd4c4}
    .ink{fill:#1d2b34}.inkS{stroke:#1d2b34}.mute{fill:#5d6c74}.muteS{stroke:#8a959a}
    .rule{stroke:#b8b09f}.card{fill:#fffdf8;stroke:#1d2b34}.band{fill:#0b6e99;fill-opacity:.1}
    .blue{fill:#0b6e99}.blueS{stroke:#0b6e99}.pass{fill:#16734b}.passS{stroke:#16734b}
    .warn{fill:#8f5a0c}.warnS{stroke:#b7791f}.fail{fill:#c23b32}.failS{stroke:#c23b32}.hatch{stroke:#c9c1ae}
    .markBg{fill:#101820}.markA{fill:#45c4b0}.markB{fill:#f4b942}
    .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    @media (prefers-color-scheme:dark){
      .paper{fill:#0c1a23}.grid{stroke:#13252f}.gridM{stroke:#1a303c}
      .ink{fill:#dbe7ec}.inkS{stroke:#dbe7ec}.mute{fill:#8fa4ae}.muteS{stroke:#6f8792}
      .rule{stroke:#35505e}.card{fill:#10222d;stroke:#dbe7ec}.band{fill:#5bb8e6;fill-opacity:.12}
      .blue{fill:#5bb8e6}.blueS{stroke:#5bb8e6}.pass{fill:#46c28b}.passS{stroke:#46c28b}
      .warn{fill:#e0a33a}.warnS{stroke:#e0a33a}.fail{fill:#ec6a5f}.failS{stroke:#ec6a5f}.hatch{stroke:#233946}
      .markBg{fill:#dbe7ec}
    }
  </style>
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" class="grid" stroke-width=".6"/></pattern>
    <pattern id="gM" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" class="gridM" stroke-width=".8"/></pattern>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" class="hatch" stroke-width="1.1"/></pattern>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="blue"/></marker>
    <marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="fail"/></marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" class="ink"/></marker>
  </defs>

  <!-- plate -->
  <rect width="960" height="592" class="paper"/>
  <rect width="960" height="592" fill="url(#g)"/>
  <rect width="960" height="592" fill="url(#gM)"/>
  <rect x="10.5" y="10.5" width="939" height="571" fill="none" class="inkS" stroke-width="1"/>
  <rect x="14.5" y="14.5" width="931" height="563" fill="none" class="rule" stroke-width=".6"/>

  <text x="40" y="52" class="mono blue" font-size="11" letter-spacing="1.6">SHP CHECK</text>
  <text x="40" y="76" class="sans ink" font-size="19" font-weight="650">From .shape files to an exit code</text>

  <!-- entry points -->
  <g fill="none" class="muteS" stroke-width="1">
    <path d="M40 106V118M40 112H48M178 112H920M920 106V118"/>
    <path d="M240 134V146M240 140H248M396 140H920M920 134V146"/>
    <path d="M464 162V174M464 168H472M650 168H920M920 162V174"/>
  </g>
  <g class="mono ink" font-size="12">
    <text x="54" y="116">checkShapeFiles</text>
    <text x="254" y="144">checkShapeModules</text>
    <text x="478" y="172">checkLoweredShapeModel</text>
  </g>
  <text x="478" y="192" class="mono mute" font-size="11.5">IncrementalShapeChecker reuses a cached Model here</text>

  <!-- stages -->
  <g class="card" stroke-width="1.2">
    <rect x="40" y="208" width="168" height="144"/>
    <rect x="240" y="208" width="192" height="144"/>
    <rect x="464" y="208" width="216" height="144"/>
    <rect x="712" y="208" width="208" height="144"/>
  </g>
  <g class="band">
    <rect x="40.6" y="208.6" width="166.8" height="24"/>
    <rect x="240.6" y="208.6" width="190.8" height="24"/>
    <rect x="464.6" y="208.6" width="214.8" height="24"/>
    <rect x="712.6" y="208.6" width="206.8" height="24"/>
  </g>
  <g class="mono blue" font-size="12" font-weight="600">
    <text x="52" y="225">parse</text>
    <text x="252" y="225">lower</text>
    <text x="476" y="225">check</text>
    <text x="724" y="225">sort</text>
  </g>
  <g class="mono ink" font-size="12">
    <text x="52" y="256">parseShapeModule</text>
    <text x="252" y="256">lowerShapeModules</text>
    <text x="476" y="256">runSemanticChecks</text>
    <text x="476" y="274" class="mute">then</text>
    <text x="512" y="274">checkBindings</text>
    <text x="724" y="256">compareShapeDiagnostics</text>
  </g>
  <g class="mono mute" font-size="11.5">
    <text x="52" y="274">Langium, per file</text>
    <text x="252" y="274">all modules, one Model</text>
    <text x="724" y="274">by kind, then text</text>
  </g>
  <g class="rule" stroke-width="1" stroke-dasharray="2 3">
    <path d="M52 288H196M252 288H420M476 288H668M724 288H908"/>
  </g>
  <g class="mono ink" font-size="11.5">
    <text x="52" y="308">→ ShapeModule ASTs</text>
    <text x="252" y="308">→ Model</text>
    <text x="268" y="324">typed indexes · facts</text>
    <text x="268" y="340">lowering diagnostics</text>
    <text x="476" y="308">→ diagnostics</text>
    <text x="476" y="324" class="mute">if allowUnknownEffects:</text>
    <text x="476" y="340" class="mute">unknown effects → warnings</text>
    <text x="724" y="308">→ CheckResult, exitCode</text>
    <text x="740" y="324">0: none blocking</text>
    <text x="740" y="340">1: any blocking</text>
  </g>
  <g class="blueS" stroke-width="1.4">
    <path d="M208 280H236" marker-end="url(#aB)"/>
    <path d="M432 280H460" marker-end="url(#aB)"/>
    <path d="M680 280H708" marker-end="url(#aB)"/>
  </g>

  <!-- input files -->
  <rect x="40" y="408" width="112" height="32" class="card" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="96" y="429" class="mono ink" font-size="12" text-anchor="middle">.shape files</text>
  <g class="mono mute" font-size="11.5">
    <text x="40" y="462">shape/**/*.shape</text>
    <text x="40" y="478">or named files</text>
  </g>
  <path d="M96 408V356" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>

  <!-- parse failure -->
  <path d="M192 352V422" class="failS" stroke-width="1.4"/>
  <g class="mono fail" font-size="11.5">
    <text x="204" y="378">any file fails</text>
    <text x="204" y="394">to parse or read</text>
  </g>
  <circle cx="192" cy="432" r="10" fill="none" class="failS" stroke-width="1.6"/>
  <path d="M187 427l10 10M197 427l-10 10" class="failS" stroke-width="1.6"/>
  <text x="212" y="436" class="mono fail" font-size="12.5">exit 2 · no Model</text>

  <!-- options -->
  <rect x="464" y="392" width="216" height="120" class="card" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="464.6" y="392.6" width="214.8" height="24" class="band"/>
  <text x="476" y="409" class="mono blue" font-size="12" font-weight="600">check options</text>
  <g class="mono ink" font-size="11.5">
    <text x="476" y="436">changedFiles</text>
    <text x="476" y="452">repoRoot</text>
    <text x="476" y="468">freshnessDate</text>
    <text x="476" y="484">enforceBindings</text>
    <text x="476" y="500">allowUnknownEffects</text>
  </g>
  <path d="M572 392V356" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>

  <!-- report -->
  <path d="M816 352V388" class="blueS" stroke-width="1.4" marker-end="url(#aB)"/>
  <rect x="712" y="392" width="208" height="56" class="card" stroke-width="1.2"/>
  <rect x="712.6" y="392.6" width="206.8" height="24" class="band"/>
  <text x="724" y="409" class="mono blue" font-size="12" font-weight="600">report · shp CLI</text>
  <text x="724" y="436" class="mono ink" font-size="12">formatDiagnostics</text>

  <!-- outcomes -->
  <path d="M768 448V466M864 448V466" fill="none" class="muteS" stroke-width="1.2"/>
  <g class="mono" font-size="12.5">
    <circle cx="768" cy="476" r="10" fill="none" class="passS" stroke-width="1.4"/>
    <path d="M763 476l4 4 6-8" fill="none" class="passS" stroke-width="1.6"/>
    <text x="768" y="506" class="pass" text-anchor="middle">exit 0</text>
    <circle cx="864" cy="476" r="10" fill="none" class="failS" stroke-width="1.6"/>
    <path d="M859 471l10 10M869 471l-10 10" class="failS" stroke-width="1.6"/>
    <text x="864" y="506" class="fail" text-anchor="middle">exit 1</text>
  </g>

  <!-- title block -->
  <g transform="translate(700 532)">
    <rect x=".5" y=".5" width="235" height="34" fill="none" class="inkS" stroke-width="1"/>
    <path d="M40 .5V34.5" class="inkS" stroke-width="1"/>
    <rect x="9" y="6" width="23" height="23" rx="5" class="markBg"/>
    <path d="M14.8 12.5h5.8l5.8 5-5.8 5h-5.8l5.8-5z" class="markA"/>
    <path d="M20.6 12.5h5.8v10h-5.8l5.8-5z" class="markB"/>
    <text x="52" y="22" class="mono ink" font-size="11" letter-spacing=".6">checker pipeline</text>
  </g>
</svg>
