<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">Coverage decision for one changed file</title>
  <desc id="d">A changed file such as src/audit/export.ts is governed only when it matches the paths of an implementation with on_change require shape_update; changed .shape files are never governed. A governed file is covered by a Shape update, meaning a function source or effect evidence naming the path in a .shape file that is itself in changed.txt, or by an attest no_shape_change for that exact path with a reason, declared in a .shape file in changed.txt. Otherwise coverage fails with error: governed source changed without current Shape update. Coverage shows that the model changed with the code, not that it is faithful. Bindings are a separate check that only shp check --changed-files runs.</desc>
  <style>
    .paper{fill:#f6f4ee}.grid{stroke:#e6e1d4}.gridM{stroke:#dbd4c4}
    .ink{fill:#1d2b34}.inkS{stroke:#1d2b34}.mute{fill:#5d6c74}.muteS{stroke:#8a959a}
    .rule{stroke:#b8b09f}.card{fill:#fffdf8;stroke:#1d2b34}.band{fill:#0b6e99;fill-opacity:.1}
    .blue{fill:#0b6e99}.blueS{stroke:#0b6e99}.pass{fill:#16734b}.passS{stroke:#16734b}
    .warn{fill:#8f5a0c}.warnS{stroke:#b7791f}.fail{fill:#c23b32}.failS{stroke:#c23b32}.hatch{stroke:#c9c1ae}
    .markBg{fill:#101820}.markA{fill:#45c4b0}.markB{fill:#f4b942}
    .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    @media (prefers-color-scheme:dark){
      .paper{fill:#0c1a23}.grid{stroke:#13252f}.gridM{stroke:#1a303c}
      .ink{fill:#dbe7ec}.inkS{stroke:#dbe7ec}.mute{fill:#8fa4ae}.muteS{stroke:#6f8792}
      .rule{stroke:#35505e}.card{fill:#10222d;stroke:#dbe7ec}.band{fill:#5bb8e6;fill-opacity:.12}
      .blue{fill:#5bb8e6}.blueS{stroke:#5bb8e6}.pass{fill:#46c28b}.passS{stroke:#46c28b}
      .warn{fill:#e0a33a}.warnS{stroke:#e0a33a}.fail{fill:#ec6a5f}.failS{stroke:#ec6a5f}.hatch{stroke:#233946}
      .markBg{fill:#dbe7ec}
    }
  </style>
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" class="grid" stroke-width=".6"/></pattern>
    <pattern id="gM" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" class="gridM" stroke-width=".8"/></pattern>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" class="hatch" stroke-width="1.1"/></pattern>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="blue"/></marker>
    <marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="fail"/></marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" class="ink"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="pass"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="mute"/></marker>
  </defs>

  <!-- plate -->
  <rect width="960" height="560" class="paper"/>
  <rect width="960" height="560" fill="url(#g)"/>
  <rect width="960" height="560" fill="url(#gM)"/>
  <rect x="10.5" y="10.5" width="939" height="539" fill="none" class="inkS" stroke-width="1"/>
  <rect x="14.5" y="14.5" width="931" height="531" fill="none" class="rule" stroke-width=".6"/>

  <text x="40" y="52" class="mono blue" font-size="11" letter-spacing="1.6">ONE CHANGED FILE</text>
  <text x="40" y="76" class="sans ink" font-size="19" font-weight="650">When coverage accepts a changed file</text>

  <!-- start -->
  <rect x="40" y="112" width="256" height="48" class="card" stroke-width="1.4"/>
  <text x="56" y="131" class="mono mute" font-size="11">changed file in changed.txt</text>
  <text x="56" y="150" class="mono ink" font-size="12.5" font-weight="700">src/audit/export.ts</text>

  <!-- spine -->
  <g class="blueS" stroke-width="1.4" fill="none" marker-end="url(#aB)">
    <path d="M72 160V181"/>
    <path d="M72 240V261"/>
    <path d="M72 336V357"/>
  </g>
  <path d="M72 416V438" fill="none" class="failS" stroke-width="1.4" marker-end="url(#aF)"/>
  <g class="mono mute" font-size="11">
    <text x="84" y="256">yes</text>
    <text x="84" y="352">no</text>
    <text x="84" y="432">no</text>
  </g>

  <!-- questions -->
  <g class="mono ink" font-size="12">
    <rect x="40" y="184" width="480" height="56" class="card" stroke-width="1.2"/>
    <text x="56" y="206" class="mute" font-size="11" letter-spacing="1.6">Q1</text>
    <text x="104" y="206">matches an <tspan class="blue">implementation</tspan> <tspan class="blue">paths</tspan> glob</text>
    <text x="104" y="224">with <tspan class="blue">on_change require shape_update</tspan>?</text>

    <rect x="40" y="264" width="480" height="72" class="card" stroke-width="1.2"/>
    <text x="56" y="286" class="mute" font-size="11" letter-spacing="1.6">Q2</text>
    <text x="104" y="286">a <tspan class="blue">.shape</tspan> file in changed.txt has a function</text>
    <text x="104" y="304"><tspan class="blue">source</tspan> or effect <tspan class="blue">evidence</tspan> naming this path?</text>
    <text x="104" y="322" class="mute" font-size="11">#symbol and :line ignored</text>

    <rect x="40" y="360" width="480" height="56" class="card" stroke-width="1.2"/>
    <text x="56" y="382" class="mute" font-size="11" letter-spacing="1.6">Q3</text>
    <text x="104" y="382">a <tspan class="blue">.shape</tspan> file in changed.txt has <tspan class="blue">attest</tspan></text>
    <text x="104" y="400"><tspan class="blue">no_shape_change</tspan> for this exact path, with a reason?</text>
  </g>

  <!-- exits -->
  <path d="M520 212H597" fill="none" class="muteS" stroke-width="1.4" marker-end="url(#aM)"/>
  <g class="passS" stroke-width="1.4" fill="none" marker-end="url(#aP)">
    <path d="M520 300H597"/>
    <path d="M520 388H597"/>
  </g>
  <g class="mono mute" font-size="11">
    <text x="540" y="205">no</text>
    <text x="540" y="293">yes</text>
    <text x="540" y="381">yes</text>
  </g>

  <!-- outcomes -->
  <circle cx="612" cy="212" r="10" fill="none" class="muteS" stroke-width="1.4"/>
  <path d="M607 212h10" class="muteS" stroke-width="1.6"/>
  <text x="632" y="209" class="mono ink" font-size="12.5">not governed</text>
  <text x="632" y="226" class="mono mute" font-size="11.5">no coverage obligation</text>
  <text x="632" y="248" class="mono mute" font-size="11.5">changed .shape files are never governed</text>

  <g fill="none" class="passS" stroke-width="1.5">
    <circle cx="612" cy="300" r="10"/><path d="M607 300l4 4 6-8"/>
    <circle cx="612" cy="388" r="10"/><path d="M607 388l4 4 6-8"/>
  </g>
  <g class="mono pass" font-size="12.5">
    <text x="632" y="304">covered · Shape update</text>
    <text x="632" y="392">covered · attestation</text>
  </g>

  <circle cx="72" cy="452" r="10" fill="none" class="failS" stroke-width="1.5"/>
  <path d="M67 447l10 10M77 447l-10 10" class="failS" stroke-width="1.5"/>
  <text x="92" y="456" class="mono fail" font-size="12.5">error: governed source changed without current Shape update</text>

  <g class="mono mute" font-size="11.5">
    <text x="40" y="504">coverage proves the model changed with the code, not that it is faithful</text>
    <text x="40" y="522">bindings are a separate check, run only by shp check --changed-files</text>
  </g>

  <!-- title block -->
  <g transform="translate(700 500)">
    <rect x=".5" y=".5" width="235" height="34" fill="none" class="inkS" stroke-width="1"/>
    <path d="M40 .5V34.5" class="inkS" stroke-width="1"/>
    <rect x="9" y="6" width="23" height="23" rx="5" class="markBg"/>
    <path d="M14.8 12.5h5.8l5.8 5-5.8 5h-5.8l5.8-5z" class="markA"/>
    <path d="M20.6 12.5h5.8v10h-5.8l5.8-5z" class="markB"/>
    <text x="52" y="22" class="mono ink" font-size="11" letter-spacing=".6">coverage</text>
  </g>
</svg>
