<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" aria-labelledby="t d">
  <title id="t">What the Shape checker reads</title>
  <desc id="d">Application source sits outside the checker boundary, where tests, typechecks, and code review still apply. Claims in .shape files point reviewers at source through evidence references. shp check reads only the .shape files and a changed-file list, then accepts the claims or rejects them with a diagnostic that names the failing claim.</desc>
  <style>
    .paper{fill:#f6f4ee}.grid{stroke:#e6e1d4}.gridM{stroke:#dbd4c4}
    .ink{fill:#1d2b34}.inkS{stroke:#1d2b34}.mute{fill:#5d6c74}.muteS{stroke:#8a959a}
    .rule{stroke:#b8b09f}.card{fill:#fffdf8;stroke:#1d2b34}.band{fill:#0b6e99;fill-opacity:.1}
    .blue{fill:#0b6e99}.blueS{stroke:#0b6e99}.pass{fill:#16734b}.passS{stroke:#16734b}
    .warn{fill:#8f5a0c}.warnS{stroke:#b7791f}.fail{fill:#c23b32}.failS{stroke:#c23b32}.hatch{stroke:#c9c1ae}
    .markBg{fill:#101820}.markA{fill:#45c4b0}.markB{fill:#f4b942}
    .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    @media (prefers-color-scheme:dark){
      .paper{fill:#0c1a23}.grid{stroke:#13252f}.gridM{stroke:#1a303c}
      .ink{fill:#dbe7ec}.inkS{stroke:#dbe7ec}.mute{fill:#8fa4ae}.muteS{stroke:#6f8792}
      .rule{stroke:#35505e}.card{fill:#10222d;stroke:#dbe7ec}.band{fill:#5bb8e6;fill-opacity:.12}
      .blue{fill:#5bb8e6}.blueS{stroke:#5bb8e6}.pass{fill:#46c28b}.passS{stroke:#46c28b}
      .warn{fill:#e0a33a}.warnS{stroke:#e0a33a}.fail{fill:#ec6a5f}.failS{stroke:#ec6a5f}.hatch{stroke:#233946}
      .markBg{fill:#dbe7ec}
    }
  </style>
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" class="grid" stroke-width=".6"/></pattern>
    <pattern id="gM" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" class="gridM" stroke-width=".8"/></pattern>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" class="hatch" stroke-width="1.1"/></pattern>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="blue"/></marker>
    <marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="fail"/></marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" class="ink"/></marker>
  </defs>

  <!-- plate -->
  <rect width="960" height="496" class="paper"/>
  <rect width="960" height="496" fill="url(#g)"/>
  <rect width="960" height="496" fill="url(#gM)"/>
  <rect x="10.5" y="10.5" width="939" height="475" fill="none" class="inkS" stroke-width="1"/>
  <rect x="14.5" y="14.5" width="931" height="467" fill="none" class="rule" stroke-width=".6"/>

  <!-- outside the checker -->
  <rect x="15" y="15" width="265" height="466" fill="url(#h)"/>
  <text x="40" y="52" class="mono mute" font-size="11" letter-spacing="1.6">OUTSIDE THE CHECKER</text>
  <text x="40" y="76" class="sans ink" font-size="19" font-weight="650">Application source</text>
  <text x="40" y="97" class="mono mute" font-size="12">src/**</text>

  <g class="mono" font-size="12">
    <rect x="40" y="130" width="210" height="96" class="card" stroke-width="1"/>
    <text x="52" y="151" class="ink">src/audit/store.ts</text>
    <path d="M52 168h120M52 184h150M64 200h96M64 212h70" class="muteS" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <rect x="40" y="248" width="210" height="96" class="card" stroke-width="1"/>
    <text x="52" y="269" class="ink">src/audit/purge.ts</text>
    <path d="M52 286h110M64 302h140M64 318h84M52 330h60" class="muteS" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  </g>
  <g class="mono ink" font-size="11.5">
    <text x="40" y="382">tests, typechecks, and</text>
    <text x="40" y="398">code review still judge</text>
    <text x="40" y="414">the implementation</text>
  </g>

  <!-- checker boundary -->
  <path d="M280 15V481" class="inkS" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="296" y="458" class="mono ink" font-size="11" letter-spacing="1.6">CHECKER BOUNDARY</text>

  <!-- authored model -->
  <text x="320" y="52" class="mono blue" font-size="11" letter-spacing="1.6">AUTHORED MODEL</text>
  <text x="320" y="76" class="sans ink" font-size="19" font-weight="650">Claims in .shape files</text>
  <text x="320" y="97" class="mono mute" font-size="12">written by people or agents, reviewed in the PR</text>

  <rect x="320" y="130" width="330" height="230" class="card" stroke-width="1.4"/>
  <rect x="320.7" y="130.7" width="328.6" height="25" class="band"/>
  <text x="332" y="148" class="mono blue" font-size="12">shape/audit.shape</text>
  <g class="mono ink" font-size="12.5">
    <text x="332" y="180">resource AuditEvent : AppendOnly</text>
    <text x="332" y="206">component AuditStore {</text>
    <text x="348" y="226">grants HardDelete&lt;AuditEvent&gt;</text>
    <text x="348" y="246">fn purgeOldEvents</text>
    <text x="364" y="266">effects complete {</text>
    <text x="380" y="286" class="fail">HardDelete&lt;AuditEvent&gt;</text>
    <text x="396" y="306" class="mute">evidence ts("…purge.ts")</text>
    <text x="364" y="326">}</text>
    <text x="332" y="346">}</text>
  </g>

  <!-- evidence leader -->
  <path d="M392 302H252" fill="none" class="muteS" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#dot)"/>
  <g class="mono mute" font-size="11.5">
    <text x="320" y="384">evidence points reviewers at source;</text>
    <text x="320" y="400">shp never opens or runs it</text>
  </g>

  <!-- changed-file input -->
  <rect x="704" y="130" width="112" height="30" class="card" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="760" y="150" class="mono ink" font-size="12" text-anchor="middle">changed.txt</text>
  <path d="M760 160V192" class="blueS" stroke-width="1.2" marker-end="url(#aB)"/>

  <!-- checker -->
  <path d="M650 237H700" class="blueS" stroke-width="1.6" marker-end="url(#aB)"/>
  <rect x="704" y="196" width="112" height="82" class="card" stroke-width="1.4"/>
  <text x="760" y="229" class="mono ink" font-size="14" font-weight="700" text-anchor="middle">shp check</text>
  <text x="760" y="250" class="mono mute" font-size="11" text-anchor="middle">parse</text>
  <text x="760" y="265" class="mono mute" font-size="11" text-anchor="middle">check claims</text>

  <!-- outcomes -->
  <path d="M816 222C846 222 850 158 882 158" fill="none" class="passS" stroke-width="1.4"/>
  <path d="M816 252C846 252 850 316 882 316" fill="none" class="failS" stroke-width="1.6"/>
  <g class="mono" font-size="12.5">
    <circle cx="896" cy="158" r="10" fill="none" class="passS" stroke-width="1.4"/>
    <path d="M891 158l4 4 6-8" fill="none" class="passS" stroke-width="1.6"/>
    <text x="896" y="190" class="pass" text-anchor="middle">accept</text>
    <circle cx="896" cy="316" r="10" fill="none" class="failS" stroke-width="1.6"/>
    <path d="M891 311l10 10M901 311l-10 10" class="failS" stroke-width="1.6"/>
    <text x="896" y="348" class="fail" text-anchor="middle">reject</text>
  </g>

  <!-- diagnostic return path -->
  <path d="M896 358V424H600V366" fill="none" class="failS" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#aF)"/>
  <text x="616" y="402" class="mono fail" font-size="11.5">diagnostic names the failing</text>
  <text x="616" y="417" class="mono fail" font-size="11.5">claim and its causes</text>

  <!-- title block -->
  <g transform="translate(700 436)">
    <rect x=".5" y=".5" width="235" height="34" fill="none" class="inkS" stroke-width="1"/>
    <path d="M40 .5V34.5" class="inkS" stroke-width="1"/>
    <rect x="9" y="6" width="23" height="23" rx="5" class="markBg"/>
    <path d="M14.8 12.5h5.8l5.8 5-5.8 5h-5.8l5.8-5z" class="markA"/>
    <path d="M20.6 12.5h5.8v10h-5.8l5.8-5z" class="markB"/>
    <text x="52" y="22" class="mono ink" font-size="11" letter-spacing=".6">product boundary</text>
  </g>
</svg>
