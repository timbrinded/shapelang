<html lang="en"><head>

<div class="stage">
  <header>
    <div class="kicker ">Authoring</div>
    <h1>First Shape File</h1>
    <p class="lede">One protected store, one owner, the functions that touch it.</p>
  </header>
  <div class="board"><div class="flow">
        <div class="card ">
    <div class="card-head">
      <div class="card-title">Resource</div>
      <div class="card-meta">target</div>

    <div class="card-body"><div class="line"><span class="mark"></span><span>The thing you protect</span></div><div class="line"><span class="mark"></span><span>e.g. AuditEvent</span></div></div>
  </div>
        <div class="arrow" aria-hidden="true">→</div>
        <div class="card ">

      <div class="card-title">Component</div>
      <div class="card-meta">boundary</div>
    </div>
    <div class="card-body"><div class="line"><span class="mark"></span><span>Who owns it</span></div><div class="line"><span class="mark"></span><span>What effects it may emit</span></div></div>
  </div>
        <div class="arrow" aria-hidden="true">→</div>
        <div class="card ">
    <div class="card-head">
      <div class="card-title">Function</div>
      <div class="card-meta">claim</div>
    </div>
    <div class="card-body"><div class="line"><span class="mark"></span><span>Effect summary only</span></div><div class="line"><span class="mark"></span><span>Not the implementation</span></div></div>
  </div>
      </div></div>
  <div class="footer"><span>shape</span><span>start small</span></div>
</div>
