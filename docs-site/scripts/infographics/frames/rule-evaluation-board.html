<!doctype html>
<html lang="en" data-diagram-theme="site-dark" data-diagram-status="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1680, initial-scale=1" />
    <title>Rule evaluation</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../icons.css" />
    <script src="../diagram-runtime.js" defer></script>
  </head>
  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Rule evaluation</h1>
      <section class="diagram layout-sequence" style="--count:5"
        aria-label="Rules compare lowered claims and emit stable pass or reject diagnostics."
        data-concept="rule-evaluation-board"
        data-source="docs-site/src/content/docs/inside-shape/rule-evaluation.md">
        <svg class="connectors" aria-hidden="true">

    <defs>
      <marker id="rule-evaluation-board-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="rule-evaluation-board-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="rule-evaluation-board-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="rule-evaluation-board-red" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>

    <path class="connector" data-edge data-from="model:right" data-to="rules:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#rule-evaluation-board-blue)" />
<path class="connector" data-edge data-from="rules:right" data-to="context:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#rule-evaluation-board-blue)" />
<path class="connector" data-edge data-from="context:right" data-to="diagnostics:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#rule-evaluation-board-blue)" />
<path class="connector" data-edge data-from="diagnostics:right" data-to="result:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#rule-evaluation-board-blue)" />
  </svg>
     <article class="node  " data-node="model" data-box data-align-row="rule-evaluation-board" data-equal-size="rule-evaluation-board">
    <span class="icon-disc "><span class="hi hi-layers" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Lowered model</strong>
      <span class="node-token" data-fit>facts + indexes</span>
    </div>
  </article>
<article class="node  " data-node="rules" data-box data-align-row="rule-evaluation-board" data-equal-size="rule-evaluation-board">
    <span class="icon-disc "><span class="hi hi-balance" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Rule set</strong>
      <span class="node-token" data-fit>forbids · grants · coverage</span>
    </div>
  </article>
<article class="node  " data-node="context" data-box data-align-row="rule-evaluation-board" data-equal-size="rule-evaluation-board">
    <span class="icon-disc "><span class="hi hi-audit" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Context checks</strong>
      <span class="node-token" data-fit>memory · guards · graph</span>
    </div>
  </article>
<article class="node  " data-node="diagnostics" data-box data-align-row="rule-evaluation-board" data-equal-size="rule-evaluation-board">
    <span class="icon-disc "><span class="hi hi-route" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Diagnostics</strong>
      <span class="node-token" data-fit>causal trail</span>
    </div>
  </article>
<article class="node  " data-node="result" data-box data-align-row="rule-evaluation-board" data-equal-size="rule-evaluation-board">
    <span class="icon-disc "><span class="hi hi-compare" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Pass or reject</strong>
      <span class="node-token" data-fit>deterministic</span>
    </div>
  </article>
     <div class="note red" data-box data-fit
    >
    <span class="hi hi-shieldBan" aria-hidden="true"></span>
    <span>final forbids cannot be waived by grants or design memory</span>
  </div>
      </section>
    </main>
  </body>
</html>
