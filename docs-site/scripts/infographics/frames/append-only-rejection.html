  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Why <span class="title-code">HardDelete</span> is rejected</h1>

        data-source="docs-site/src/content/docs/learn/append-only-walkthrough.md">

    <defs>
      <marker id="append-only-rejection-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"

        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="append-only-rejection-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="append-only-rejection-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="append-only-rejection-red" markerWidth="18" markerHeight="18" refX="16" refY="9"

        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>
    
    <path class="connector" data-edge data-from="claim:right" data-to="compare:top"
    data-route="curve"
    data-target-gap="9"
    
    
    marker-end="url(#append-only-rejection-blue)" />
<path class="connector green" data-edge data-from="grant:right" data-to="compare:left"
    data-route="curve"
    data-target-gap="9"
    
    
    marker-end="url(#append-only-rejection-green)" />
<path class="connector red" data-edge data-from="ban:right" data-to="compare:bottom"
    data-route="curve"
    data-target-gap="9"
    
    
    marker-end="url(#append-only-rejection-red)" />
<path class="connector red strong" data-edge data-from="compare:right" data-to="reject:left"
    data-route="straight"
    data-target-gap="9"
    
    
    marker-end="url(#append-only-rejection-red)" />
  </svg>
     <div class="decision-inputs"><article class="node  " data-node="claim" data-box data-equal-size="append-only-rejection-inputs">
    <span class="icon-disc "><span class="hi hi-fileCode" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>purgeOldEvents</strong>

    </div>
  </article>
<article class="node green " data-node="grant" data-box data-align-row="append-only-rejection-center" data-equal-size="append-only-rejection-inputs">

  </article>
<article class="node red " data-node="ban" data-box data-equal-size="append-only-rejection-inputs">
    <span class="icon-disc red"><span class="hi hi-shieldBan" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>AppendOnly</strong>
      <span class="node-token" data-fit>forbid final HardDelete</span>

  </article></div>

  </div>

      <strong class="node-label" data-fit>Rejected</strong>
      <span class="node-token" data-fit>forbidden effect</span>
    </div>
  </article>
     <div class="note red" data-box data-fit
    >
    <span class="hi hi-route" aria-hidden="true"></span>
    <span>function claim → resource trait → final forbid</span>
  </div>
