<!doctype html>
<html lang="en" data-diagram-theme="site-dark" data-diagram-status="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1680, initial-scale=1" />
    <title>Your first check</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../icons.css" />
    <script src="../diagram-runtime.js" defer></script>
  </head>
  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Your first check</h1>
      <section class="diagram layout-sequence" style="--count:5"
        aria-label="Install Shape, write a model, check it, read diagnostics, and update the model."
        data-concept="quickstart-loop"
        data-source="docs-site/src/content/docs/learn/quickstart.md">
        <svg class="connectors" aria-hidden="true">

    <defs>
      <marker id="quickstart-loop-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="quickstart-loop-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="quickstart-loop-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="quickstart-loop-red" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>

    <path class="connector" data-edge data-from="install:right" data-to="shape:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#quickstart-loop-blue)" />
<path class="connector" data-edge data-from="shape:right" data-to="run:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#quickstart-loop-blue)" />
<path class="connector amber" data-edge data-from="run:right" data-to="read:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#quickstart-loop-amber)" />
<path class="connector" data-edge data-from="read:right" data-to="update:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#quickstart-loop-blue)" />
<path class="connector amber" data-edge data-from="update:bottom" data-to="run:bottom"
    data-route="curve"
    data-target-gap="9"
    data-tension="0.34"

    marker-end="url(#quickstart-loop-amber)" />
  </svg>
     <article class="node  " data-node="install" data-box data-align-row="quickstart-loop" data-equal-size="quickstart-loop">
    <span class="icon-disc "><span class="hi hi-terminal" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Install</strong>
      <span class="node-token" data-fit>shp</span>
    </div>
  </article>
<article class="node  " data-node="shape" data-box data-align-row="quickstart-loop" data-equal-size="quickstart-loop">
    <span class="icon-disc "><span class="hi hi-fileEdit" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Write</strong>
      <span class="node-token" data-fit>shape/*.shape</span>
    </div>
  </article>
<article class="node  " data-node="run" data-box data-align-row="quickstart-loop" data-equal-size="quickstart-loop">
    <span class="icon-disc "><span class="hi hi-terminal" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Check</strong>
      <span class="node-token" data-fit>shp check</span>
    </div>
  </article>
<article class="node amber " data-node="read" data-box data-align-row="quickstart-loop" data-equal-size="quickstart-loop">
    <span class="icon-disc amber"><span class="hi hi-alert" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Read</strong>
      <span class="node-token" data-fit>diagnostics</span>
    </div>
  </article>
<article class="node  " data-node="update" data-box data-align-row="quickstart-loop" data-equal-size="quickstart-loop">
    <span class="icon-disc "><span class="hi hi-flow" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Update</strong>
      <span class="node-token" data-fit>model</span>
    </div>
  </article>
     <div class="note " data-box data-fit
    data-edge-label="update:bottom->run:bottom">
    <span class="hi hi-check" aria-hidden="true"></span>
    <span>repeat until the check passes • then run it in CI</span>
  </div>
      </section>
    </main>
  </body>
</html>
