<!doctype html>
<html lang="en" data-diagram-theme="site-dark" data-diagram-status="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1680, initial-scale=1" />
    <title>Review helpers</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../icons.css" />
    <script src="../diagram-runtime.js" defer></script>
  </head>
  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Review helpers</h1>
      <section class="diagram layout-sequence" style="--count:5"
        aria-label="Formatting, checking, editor feedback, and authoring helpers support one human-owned review loop."
        data-concept="review-helpers"
        data-source="docs-site/src/content/docs/inside-shape/formatter-editor-authoring.md">
        <svg class="connectors" aria-hidden="true">
    
    <defs>
      <marker id="review-helpers-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="review-helpers-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="review-helpers-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="review-helpers-red" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>
    
    <path class="connector" data-edge data-from="draft:right" data-to="format:left"
    data-route="straight"
    data-target-gap="9"
    
    
    marker-end="url(#review-helpers-blue)" />
<path class="connector" data-edge data-from="format:right" data-to="check:left"
    data-route="straight"
    data-target-gap="9"
    
    
    marker-end="url(#review-helpers-blue)" />
<path class="connector" data-edge data-from="check:right" data-to="editor:left"
    data-route="straight"
    data-target-gap="9"
    
    
    marker-end="url(#review-helpers-blue)" />
<path class="connector green" data-edge data-from="editor:right" data-to="review:left"
    data-route="straight"
    data-target-gap="9"
    
    
    marker-end="url(#review-helpers-green)" />
<path class="connector amber" data-edge data-from="review:bottom" data-to="format:bottom"
    data-route="curve"
    data-target-gap="9"
    data-tension="0.34"
    
    marker-end="url(#review-helpers-amber)" />
  </svg>
     <article class="node  " data-node="draft" data-box data-align-row="review-helpers" data-equal-size="review-helpers">
    <span class="icon-disc "><span class="hi hi-agent" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Proposed .shape</strong>
      <span class="node-token" data-fit>effects unknown</span>
    </div>
  </article>
<article class="node  " data-node="format" data-box data-align-row="review-helpers" data-equal-size="review-helpers">
    <span class="icon-disc "><span class="hi hi-fileEdit" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Formatter</strong>
      <span class="node-token" data-fit>stable diff</span>
    </div>
  </article>
<article class="node  " data-node="check" data-box data-align-row="review-helpers" data-equal-size="review-helpers">
    <span class="icon-disc "><span class="hi hi-terminal" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Checker</strong>
      <span class="node-token" data-fit>semantic truth</span>
    </div>
  </article>
<article class="node  " data-node="editor" data-box data-align-row="review-helpers" data-equal-size="review-helpers">
    <span class="icon-disc "><span class="hi hi-code" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Editor APIs</strong>
      <span class="node-token" data-fit>diagnostics</span>
    </div>
  </article>
<article class="node green " data-node="review" data-box data-align-row="review-helpers" data-equal-size="review-helpers">
    <span class="icon-disc green"><span class="hi hi-userCheck" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Human review</strong>
      <span class="node-token" data-fit>fills evidence</span>
    </div>
  </article>
     <div class="note amber" data-box data-fit
    data-edge-label="review:bottom->format:bottom">
    <span class="hi hi-flow" aria-hidden="true"></span>
    <span>resolve unknowns • then format and check again</span>
  </div>
      </section>
    </main>
  </body>
</html>
