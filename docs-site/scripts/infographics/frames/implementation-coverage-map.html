<!doctype html>
<html lang="en" data-diagram-theme="site-dark" data-diagram-status="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1680, initial-scale=1" />
    <title>Implementation coverage</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../icons.css" />
    <script src="../diagram-runtime.js" defer></script>
  </head>
  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Implementation coverage</h1>
      <section class="diagram layout-sequence" style="--count:5"
        aria-label="A changed governed file must reach its owning model update or a narrow attestation."
        data-concept="implementation-coverage-map"
        data-source="docs-site/src/content/docs/concepts/implementations-coverage.md">
        <svg class="connectors" aria-hidden="true">

    <defs>
      <marker id="implementation-coverage-map-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="implementation-coverage-map-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="implementation-coverage-map-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="implementation-coverage-map-red" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>

    <path class="connector" data-edge data-from="change:right" data-to="binding:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#implementation-coverage-map-blue)" />
<path class="connector" data-edge data-from="binding:right" data-to="owner:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#implementation-coverage-map-blue)" />
<path class="connector" data-edge data-from="owner:right" data-to="document:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#implementation-coverage-map-blue)" />
<path class="connector green" data-edge data-from="document:right" data-to="gate:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#implementation-coverage-map-green)" />
  </svg>
     <article class="node  " data-node="change" data-box data-align-row="implementation-coverage-map" data-equal-size="implementation-coverage-map">
    <span class="icon-disc "><span class="hi hi-branch" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Changed file</strong>
      <span class="node-token" data-fit>source path</span>
    </div>
  </article>
<article class="node  " data-node="binding" data-box data-align-row="implementation-coverage-map" data-equal-size="implementation-coverage-map">
    <span class="icon-disc "><span class="hi hi-link" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Binding</strong>
      <span class="node-token" data-fit>governed path</span>
    </div>
  </article>
<article class="node  " data-node="owner" data-box data-align-row="implementation-coverage-map" data-equal-size="implementation-coverage-map">
    <span class="icon-disc "><span class="hi hi-hierarchy" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Implementation</strong>
      <span class="node-token" data-fit>component</span>
    </div>
  </article>
<article class="node  " data-node="document" data-box data-align-row="implementation-coverage-map" data-equal-size="implementation-coverage-map">
    <span class="icon-disc "><span class="hi hi-fileEdit" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Document</strong>
      <span class="node-token" data-fit>model update · attestation</span>
    </div>
  </article>
<article class="node green " data-node="gate" data-box data-align-row="implementation-coverage-map" data-equal-size="implementation-coverage-map">
    <span class="icon-disc green"><span class="hi hi-shield" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Coverage gate</strong>
      <span class="node-token" data-fit>complete</span>
    </div>
  </article>
     <div class="note " data-box data-fit
    >
    <span class="hi hi-documentCheck" aria-hidden="true"></span>
    <span>coverage checks documentation • not implementation correctness</span>
  </div>
      </section>
    </main>
  </body>
</html>
