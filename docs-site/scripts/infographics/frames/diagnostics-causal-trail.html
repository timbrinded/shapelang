<!doctype html>
<html lang="en" data-diagram-theme="site-dark" data-diagram-status="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1680, initial-scale=1" />
    <title>Diagnostic causal trail</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../icons.css" />
    <script src="../diagram-runtime.js" defer></script>
  </head>
  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Diagnostic causal trail</h1>
      <section class="diagram layout-sequence" style="--count:5"
        aria-label="A rejected function claim is explained through its effect, resource, trait, and evidence."
        data-concept="diagnostics-causal-trail"
        data-source="docs-site/src/content/docs/concepts/diagnostics-provenance.md">
        <svg class="connectors" aria-hidden="true">

    <defs>
      <marker id="diagnostics-causal-trail-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="diagnostics-causal-trail-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="diagnostics-causal-trail-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="diagnostics-causal-trail-red" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>

    <path class="connector" data-edge data-from="function:right" data-to="effect:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#diagnostics-causal-trail-blue)" />
<path class="connector" data-edge data-from="effect:right" data-to="resource:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#diagnostics-causal-trail-blue)" />
<path class="connector red" data-edge data-from="resource:right" data-to="trait:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#diagnostics-causal-trail-red)" />
<path class="connector red" data-edge data-from="trait:right" data-to="diagnostic:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#diagnostics-causal-trail-red)" />
  </svg>
     <article class="node  " data-node="function" data-box data-align-row="diagnostics-causal-trail" data-equal-size="diagnostics-causal-trail">
    <span class="icon-disc "><span class="hi hi-code" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Function claim</strong>
      <span class="node-token" data-fit>purgeOldEvents</span>
    </div>
  </article>
<article class="node  " data-node="effect" data-box data-align-row="diagnostics-causal-trail" data-equal-size="diagnostics-causal-trail">
    <span class="icon-disc "><span class="hi hi-flow" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Effect</strong>
      <span class="node-token" data-fit>HardDelete<wbr />&lt;AuditEvent&gt;</span>
    </div>
  </article>
<article class="node  " data-node="resource" data-box data-align-row="diagnostics-causal-trail" data-equal-size="diagnostics-causal-trail">
    <span class="icon-disc "><span class="hi hi-database" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Resource</strong>
      <span class="node-token" data-fit>AuditEvent</span>
    </div>
  </article>
<article class="node red " data-node="trait" data-box data-align-row="diagnostics-causal-trail" data-equal-size="diagnostics-causal-trail">
    <span class="icon-disc red"><span class="hi hi-shieldBan" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Trait constraint</strong>
      <span class="node-token" data-fit>AppendOnly</span>
    </div>
  </article>
<article class="node red " data-node="diagnostic" data-box data-align-row="diagnostics-causal-trail" data-equal-size="diagnostics-causal-trail">
    <span class="icon-disc red"><span class="hi hi-alert" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Diagnostic</strong>
      <span class="node-token" data-fit>forbidden effect</span>
    </div>
  </article>
     <div class="note " data-box data-fit
    >
    <span class="hi hi-route" aria-hidden="true"></span>
    <span>every hop retains declaration and source provenance</span>
  </div>
      </section>
    </main>
  </body>
</html>
