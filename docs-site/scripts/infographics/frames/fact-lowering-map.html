<!doctype html>
<html lang="en" data-diagram-theme="site-dark" data-diagram-status="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1680, initial-scale=1" />
    <title>Fact lowering</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../icons.css" />
    <script src="../diagram-runtime.js" defer></script>
  </head>
  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Fact lowering</h1>
      <section class="diagram layout-sequence" style="--count:5"
        aria-label="Declarations and changes become one effective model with typed indexes, facts, and provenance."
        data-concept="fact-lowering-map"
        data-source="docs-site/src/content/docs/inside-shape/fact-lowering.md">
        <svg class="connectors" aria-hidden="true">

    <defs>
      <marker id="fact-lowering-map-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="fact-lowering-map-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="fact-lowering-map-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="fact-lowering-map-red" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>

    <path class="connector" data-edge data-from="declarations:right" data-to="changes:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#fact-lowering-map-blue)" />
<path class="connector" data-edge data-from="changes:right" data-to="model:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#fact-lowering-map-blue)" />
<path class="connector" data-edge data-from="model:right" data-to="facts:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#fact-lowering-map-blue)" />
<path class="connector" data-edge data-from="facts:right" data-to="rules:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#fact-lowering-map-blue)" />
  </svg>
     <article class="node  " data-node="declarations" data-box data-align-row="fact-lowering-map" data-equal-size="fact-lowering-map">
    <span class="icon-disc "><span class="hi hi-fileCode" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Declarations</strong>
      <span class="node-token" data-fit>ShapeModule ASTs</span>
    </div>
  </article>
<article class="node  " data-node="changes" data-box data-align-row="fact-lowering-map" data-equal-size="fact-lowering-map">
    <span class="icon-disc "><span class="hi hi-branch" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Apply changes</strong>
      <span class="node-token" data-fit>global model</span>
    </div>
  </article>
<article class="node  " data-node="model" data-box data-align-row="fact-lowering-map" data-equal-size="fact-lowering-map">
    <span class="icon-disc "><span class="hi hi-layers" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Effective model</strong>
      <span class="node-token" data-fit>typed indexes</span>
    </div>
  </article>
<article class="node  " data-node="facts" data-box data-align-row="fact-lowering-map" data-equal-size="fact-lowering-map">
    <span class="icon-disc "><span class="hi hi-database" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Facts</strong>
      <span class="node-token" data-fit>normalized records</span>
    </div>
  </article>
<article class="node  " data-node="rules" data-box data-align-row="fact-lowering-map" data-equal-size="fact-lowering-map">
    <span class="icon-disc "><span class="hi hi-balance" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Semantic checks</strong>
      <span class="node-token" data-fit>diagnostics</span>
    </div>
  </article>
     <div class="note " data-box data-fit
    >
    <span class="hi hi-route" aria-hidden="true"></span>
    <span>facts retain provenance • rules do not rescan source text</span>
  </div>
      </section>
    </main>
  </body>
</html>
