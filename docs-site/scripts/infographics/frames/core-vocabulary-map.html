<!doctype html>
<html lang="en" data-diagram-theme="site-dark" data-diagram-status="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1680, initial-scale=1" />
    <title>Core vocabulary</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../icons.css" />
    <script src="../diagram-runtime.js" defer></script>
  </head>
  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Core vocabulary</h1>
      <section class="diagram layout-hub"
        aria-label="Shape connects resources, traits, effects, components, grants, and evidence."
        data-concept="core-vocabulary-map"
        data-source="docs-site/src/content/docs/concepts/resources-traits-effects.md,docs-site/src/content/docs/concepts/components-ownership-grants.md">
        <svg class="connectors" aria-hidden="true">

    <defs>
      <marker id="core-vocabulary-map-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="core-vocabulary-map-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="core-vocabulary-map-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="core-vocabulary-map-red" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>

    <path class="connector" data-edge data-from="component:top" data-to="resource:bottom"
    data-route="curve"
    data-target-gap="9"


     />
<path class="connector" data-edge data-from="component:left" data-to="trait:right"
    data-route="curve"
    data-target-gap="9"


     />
<path class="connector green" data-edge data-from="component:right" data-to="effect:left"
    data-route="curve"
    data-target-gap="9"


     />
<path class="connector" data-edge data-from="component:bottom" data-to="grant:right"
    data-route="curve"
    data-target-gap="9"


     />
<path class="connector" data-edge data-from="component:bottom" data-to="evidence:left"
    data-route="curve"
    data-target-gap="9"


     />
  </svg>
     <article class="node  hub-center" data-node="component" data-box>
    <span class="icon-disc "><span class="hi hi-hierarchy" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Component</strong>
      <span class="node-token" data-fit>ownership + grants</span>
    </div>
  </article>
     <article class="node  slot-north" data-node="resource" data-box data-equal-size="core-vocabulary-map-satellites">
    <span class="icon-disc "><span class="hi hi-database" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Resource</strong>
      <span class="node-token" data-fit>AuditEvent</span>
    </div>
  </article>
<article class="node  slot-west" data-node="trait" data-box data-equal-size="core-vocabulary-map-satellites">
    <span class="icon-disc "><span class="hi hi-shield" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Trait</strong>
      <span class="node-token" data-fit>AppendOnly</span>
    </div>
  </article>
<article class="node green slot-east" data-node="effect" data-box data-equal-size="core-vocabulary-map-satellites">
    <span class="icon-disc green"><span class="hi hi-flow" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Effect</strong>
      <span class="node-token" data-fit>Append<wbr />&lt;AuditEvent&gt;</span>
    </div>
  </article>
<article class="node  slot-south-west" data-node="grant" data-box data-equal-size="core-vocabulary-map-satellites">
    <span class="icon-disc "><span class="hi hi-check" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Grant</strong>
      <span class="node-token" data-fit>component permission</span>
    </div>
  </article>
<article class="node  slot-south-east" data-node="evidence" data-box data-equal-size="core-vocabulary-map-satellites">
    <span class="icon-disc "><span class="hi hi-link" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Evidence</strong>
      <span class="node-token" data-fit>reviewable source</span>
    </div>
  </article>
     <div class="note " data-box data-fit
    >
    <span class="hi hi-documentCheck" aria-hidden="true"></span>
    <span>typed claims describe architecture • not runtime allocation</span>
  </div>
      </section>
    </main>
  </body>
</html>
