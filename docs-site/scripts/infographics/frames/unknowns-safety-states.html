<!doctype html>
<html lang="en" data-diagram-theme="site-dark" data-diagram-status="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1680, initial-scale=1" />
    <title>Unknowns stay visible</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../icons.css" />
    <script src="../diagram-runtime.js" defer></script>
  </head>
  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Unknowns stay visible</h1>
      <section class="diagram layout-sequence" style="--count:4"
        aria-label="Unknown effects block strict checking until evidence supports a complete effect summary."
        data-concept="unknowns-safety-states"
        data-source="docs-site/src/content/docs/concepts/unknowns-safety.md">
        <svg class="connectors" aria-hidden="true">

    <defs>
      <marker id="unknowns-safety-states-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="unknowns-safety-states-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="unknowns-safety-states-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="unknowns-safety-states-red" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>

    <path class="connector" data-edge data-from="unknown:right" data-to="review:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#unknowns-safety-states-blue)" />
<path class="connector" data-edge data-from="review:right" data-to="complete:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#unknowns-safety-states-blue)" />
<path class="connector green" data-edge data-from="complete:right" data-to="known:left"
    data-route="straight"
    data-target-gap="9"


    marker-end="url(#unknowns-safety-states-green)" />
  </svg>
     <article class="node amber " data-node="unknown" data-box data-align-row="unknowns-safety-states" data-equal-size="unknowns-safety-states">
    <span class="icon-disc amber"><span class="hi hi-alert" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Effects unknown</strong>
      <span class="node-token" data-fit>review blocker</span>
    </div>
  </article>
<article class="node  " data-node="review" data-box data-align-row="unknowns-safety-states" data-equal-size="unknowns-safety-states">
    <span class="icon-disc "><span class="hi hi-userCheck" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Review</strong>
      <span class="node-token" data-fit>source evidence</span>
    </div>
  </article>
<article class="node  " data-node="complete" data-box data-align-row="unknowns-safety-states" data-equal-size="unknowns-safety-states">
    <span class="icon-disc "><span class="hi hi-documentCheck" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Effects complete</strong>
      <span class="node-token" data-fit>explicit claim</span>
    </div>
  </article>
<article class="node green " data-node="known" data-box data-align-row="unknowns-safety-states" data-equal-size="unknowns-safety-states">
    <span class="icon-disc green"><span class="hi hi-check" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Known effects</strong>
      <span class="node-token" data-fit>checkable model</span>
    </div>
  </article>
     <div class="note " data-box data-fit
    >
    <span class="hi hi-audit" aria-hidden="true"></span>
    <span>memory records known constraints • it does not erase uncertainty</span>
  </div>
      </section>
    </main>
  </body>
</html>
