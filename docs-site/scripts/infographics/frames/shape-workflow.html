<!doctype html>
<html lang="en" data-diagram-theme="site-dark" data-diagram-status="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1680, initial-scale=1" />
    <title>Architecture review in CI</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../icons.css" />
    <script src="../diagram-runtime.js" defer></script>
  </head>
  <body>
    <main class="canvas">
      <h1 class="diagram-title" data-fit>Architecture review in CI</h1>
      <section class="diagram layout-sequence" style="--count:5"
        aria-label="A code change updates reviewed Shape claims before deterministic checking and CI."
        data-concept="shape-workflow"
        data-source="README.md">
        <svg class="connectors" aria-hidden="true">
    
    <defs>
      <marker id="shape-workflow-blue" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#42aee4" />
      </marker>
      <marker id="shape-workflow-green" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#19a66a" />
      </marker>
      <marker id="shape-workflow-amber" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d28b00" />
      </marker>
      <marker id="shape-workflow-red" markerWidth="18" markerHeight="18" refX="16" refY="9"
        orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0 0L18 9L0 18Z" fill="#d13b3b" />
      </marker>
    </defs>
    
    <path class="connector" data-edge data-from="diff:right" data-to="draft:left"
    data-route="straight"
    data-target-gap="9"
    
    
    marker-end="url(#shape-workflow-blue)" />
<path class="connector" data-edge data-from="draft:right" data-to="review:left"
    data-route="straight"
    data-target-gap="9"
    
    
    marker-end="url(#shape-workflow-blue)" />
<path class="connector" data-edge data-from="review:right" data-to="check:left"
    data-route="straight"
    data-target-gap="9"
    
    
    marker-end="url(#shape-workflow-blue)" />
<path class="connector green" data-edge data-from="check:right" data-to="ci:left"
    data-route="straight"
    data-target-gap="9"
    
    
    marker-end="url(#shape-workflow-green)" />
  </svg>
     <article class="node  " data-node="diff" data-box data-align-row="shape-workflow" data-equal-size="shape-workflow">
    <span class="icon-disc "><span class="hi hi-branch" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Code change</strong>
      <span class="node-token" data-fit>architecture diff</span>
    </div>
  </article>
<article class="node  " data-node="draft" data-box data-align-row="shape-workflow" data-equal-size="shape-workflow">
    <span class="icon-disc "><span class="hi hi-fileEdit" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Shape update</strong>
      <span class="node-token" data-fit>reviewed claims</span>
    </div>
  </article>
<article class="node  " data-node="review" data-box data-align-row="shape-workflow" data-equal-size="shape-workflow">
    <span class="icon-disc "><span class="hi hi-userCheck" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Human review</strong>
      <span class="node-token" data-fit>evidence + unknowns</span>
    </div>
  </article>
<article class="node  " data-node="check" data-box data-align-row="shape-workflow" data-equal-size="shape-workflow">
    <span class="icon-disc "><span class="hi hi-terminal" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>Check</strong>
      <span class="node-token" data-fit>shp check</span>
    </div>
  </article>
<article class="node green " data-node="ci" data-box data-align-row="shape-workflow" data-equal-size="shape-workflow">
    <span class="icon-disc green"><span class="hi hi-shield" aria-hidden="true"></span></span>
    <div class="node-content">
      <strong class="node-label" data-fit>CI gate</strong>
      <span class="node-token" data-fit>pass or reject</span>
    </div>
  </article>
     <div class="note " data-box data-fit
    >
    <span class="hi hi-route" aria-hidden="true"></span>
    <span>the model records intent • diagnostics explain rejected claims</span>
  </div>
      </section>
    </main>
  </body>
</html>
