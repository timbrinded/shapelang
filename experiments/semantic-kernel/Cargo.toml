[package]
name = "shape-semantic-kernel"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "BSD-3-Clause"
description = "Experimental fact-consuming semantic kernel for Shape"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
