[package]
name = "vprobe"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde_json = "1.0.154"
sha2 = "0.11.1"
verus_syn = { version = "0.0.0-2026-09-06-0133", features = [
  "full",
  "extra-traits",
  "visit",
  "visit-mut",
  "printing"
] }
